    <script>
      // Apply the stored theme before first paint to prevent a light-mode flash.
      (function () {
        try {
          var pref = localStorage.getItem("csp_theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
