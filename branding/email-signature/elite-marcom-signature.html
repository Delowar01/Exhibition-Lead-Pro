<!--
  ELITE MARCOM — Animated HTML Email Signature
  Mohammad Delowar Hossain · Chief Operating Officer

  HOW IT WORKS
  · Table-based, inline-styled markup renders in every mail client (Gmail, Outlook, Apple Mail, iOS, Android).
  · The <style> block adds motion (photo ring, shimmer bar, staggered reveal, icon lift) in clients that keep
    embedded CSS: Apple Mail, iOS Mail, Outlook for Mac, Thunderbird, Samsung Mail. Gmail and Outlook for
    Windows strip it and show the identical signature, just still.
  · Every image is loaded from a URL. Upload the files in ./assets plus photo.jpg and logo.png to your web host,
    then replace ASSET_BASE below (search for https://www.elitemarcom.com/signature/).

  ASSET LIST (see README.md)
    photo.jpg   240×240 px square headshot          logo.png       360×120 px on transparent background
    linkedin.png instagram.png facebook.png youtube.png (64 px)   phone.png pin.png globe.png (32 px)
-->
<style type="text/css">
  @keyframes emsRise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes emsSpin   { to { transform: rotate(360deg); } }
  @keyframes emsUnspin { to { transform: rotate(-360deg); } }
  @keyframes emsGrow   { from { width: 0; } to { width: 56px; } }
  @keyframes emsShine  { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .ems-r1, .ems-r2, .ems-r3, .ems-r4, .ems-r5, .ems-r6 { animation: emsRise 0.7s cubic-bezier(.22,.61,.36,1) both; }
  .ems-r2 { animation-delay: .12s; } .ems-r3 { animation-delay: .24s; } .ems-r4 { animation-delay: .36s; }
  .ems-r5 { animation-delay: .48s; } .ems-r6 { animation-delay: .60s; }
  .ems-ring { animation: emsSpin 9s linear infinite; }
  .ems-ring img { animation: emsUnspin 9s linear infinite; }
  .ems-rule { animation: emsGrow 0.9s cubic-bezier(.22,.61,.36,1) .5s both; }
  .ems-bar { background-image: linear-gradient(90deg, #C9A227 0%, #F3E4A6 40%, #C9A227 60%, #8F6F12 100%) !important; background-size: 200% 100% !important; animation: emsShine 3.2s linear infinite; }
  .ems-soc img { transition: transform .25s ease, opacity .25s ease; }
  .ems-soc:hover img { transform: translateY(-3px) scale(1.06); }
  @media (prefers-reduced-motion: reduce) {
    .ems-r1, .ems-r2, .ems-r3, .ems-r4, .ems-r5, .ems-r6, .ems-ring, .ems-ring img, .ems-rule, .ems-bar { animation: none !important; }
  }
</style>
