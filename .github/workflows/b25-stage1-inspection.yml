# =============================================================================
# TEMPORARY — B25 Stage 1 hosted activation tooling (dispatch-only; one-off ops
# workflow, NOT the deployment pipeline and NOT application code).
#
# FILE PATH: this file deliberately lives at the path of the already REGISTERED
# workflow `b25-stage1-inspection.yml` (GitHub workflow id 376505024, registered
# by run #1 on ops/b25-stage1-inspection). GitHub assigns a workflow id only to
# files on the default branch or files that have produced a run; a dispatch-only
# file that exists solely on an ops branch is never registered and therefore
# cannot be dispatched. Dispatching workflow 376505024 with
# ref=ops/b25-stage1-apply runs THIS file (the content at the dispatched ref) —
# the same mechanism every earlier ops activation used (b20-hosted-activation.yml
# dispatched on ops/b23-g6-activation and ops/b24-hosted-activation). The strict
# ref guard below means the inspection branch's own file never runs this content
# and this content never runs on any other ref.
# =============================================================================
# Trigger: workflow_dispatch ONLY (no push / pull_request trigger; this workflow
#          never pushes a Git ref, never fast-forwards develop and never deploys —
#          deployment stays the owner's push of develop → deploy-dev-vps.yml).
# Guard:   runs only on ops/b25-stage2a-fs-activation-tooling whose content must equal
#          the B25 Stage 1 closure product commit (e559b002, the deployed develop)
#          plus the six ops files (the postdelete-verify content 96f85eeb plus the
#          Stage 2A modes below).
#
# B25 STAGE 2A — FILESYSTEM PRIMARY ACTIVATION (fs primary on the EXISTING named
# volume `objectdata` at /data/objects + strict GCS mirror + legacy fallback):
#   stage2a_precheck          READ-ONLY: 30 pre-switch prerequisites (locked product commit,
#                             clean checkout, health, readiness, no lock / job / dead job,
#                             schema fingerprint, bucket primary with every switch off, the
#                             named volume mounted 999:999 / 0700 / no symlink / empty,
#                             capacity, the Stage 1 exception exact and isolated, no
#                             uncertainty / unproven / cleanup-pending / lease, census
#                             5 / 1398 / 1 / 36d90200…, originals and references 4/4) →
#                             B25_STAGE2A_PRECHECK_ELIGIBLE. No input used; no write test.
#   stage2a_postswitch_verify READ-ONLY, after an authorized activation: 22 post-switch
#                             prerequisites (driver fs, fallback on, mirror on, legacy delete
#                             off, key configured, env file = the fixed set + the owner's key
#                             line, counters 0, inventory / exception / census unchanged, the
#                             volume writable, no path / key / credential leak in logs) →
#                             B25_STAGE2A_POSTSWITCH_READY. No input used.
#   stage2a_activate          MUTATION (NOT authorized by the tooling commit; typed confirmation
#                             ACTIVATE_B25_STAGE2A_FS_MIRROR_GCS + the product commit + the
#                             maintenance window, all compared here BEFORE SSH): fresh precheck →
#                             owner-staged key line present (counted, never read) → the five
#                             locked variables rendered into the VPS env file → api recreated →
#                             post-switch verify; any failure → rollback (DRIVER=gcs explicit) →
#                             api recreated → bucket primary healthy. Nothing else changes; no
#                             object is copied, moved or deleted. The always-step reports the state.
#   stage2a_smoke             MUTATION (typed confirmation RUN_B25_STAGE2A_DISPOSABLE_SMOKE): the
#                             disposable fs + strict-mirror smoke — one object-holding disposable
#                             tenant (+ one object-less foreign tenant for the cross-tenant 404),
#                             first-party upload / download, encrypted file + mirror proofs, api
#                             recreate persistence proof, tenant deletion through the product API,
#                             purge job, absence proofs, exact tombstone removal, census and
#                             filesystem back to the pre-smoke state (always-step cleanup).
#   stage2a_rollback          MUTATION (typed confirmation ROLLBACK_B25_STAGE2A_TO_GCS): the explicit
#                             rollback; fs files and bucket objects are never deleted.
#   (Correction 3)            the smoke protects the existing tenant with a tiered PRE-SMOKE SNAPSHOT →
#                             POST-SMOKE COMPARISON (identity / security / billing strict, business
#                             movement attributed, isolation proven) instead of the frozen whole-tenant
#                             digest; the snapshot is one base64 line of counts / booleans / digests kept
#                             on the runner and returned to the cleanup session on its stdin stream.
#   (Correction 4)            the smoke's recreate step applies the MID-SMOKE form of the switched guard
#                             (the exception row + exactly the two rows recorded by the same run's
#                             verification step, re-proven with their files, mirrors and the census); the
#                             uuids and the run's fixture facts travel on the stdin stream only. Modes
#                             stage2a_residue_inspect_ec7ceda89a58 (READ-ONLY) / stage2a_residue_settle_ec7ceda89a58
#                             (MUTATION) settle the exact company-58 residue of run 38958264416.
#   (Correction 7)            the same-run smoke branding allowance (the smoke tenant's own first-party logo key
#                             resolves only to the recorded branding row of THIS run), the form-aware record
#                             comparison (tenant_keys_md5 = P's keys; tenant_live_keys_md5 = the file set) and
#                             every evaluator verdict printed before any decision. Modes
#                             stage2a_residue_inspect_2c4bfb197fd4 (READ-ONLY) / stage2a_residue_settle_2c4bfb197fd4
#                             (MUTATION) settle the exact company-60 residue of run 39880703889 under the protected model.
#   stage2a_tenant_drift_inspect
#                             READ-ONLY: localizes the existing-tenant baseline drift that stopped
#                             the corrected smoke run 38934705535 before any write (tenant_md5 ≠
#                             the accepted TENANT_BASELINE_MD5) — digest verdict, kept-row counts,
#                             per-table rows created / modified / soft-deleted since the last
#                             matching guard, audit action counts, recurring-sweep evidence; no
#                             tenant value printed; no constant changed; no input used.
# OBJECT_STORAGE_ENCRYPTION_KEY: staged by the owner in the VPS env file (mode 600) through the
# existing secret mechanism; never a workflow input, secret, argument or log line. No Stage 2B
# migration wrapper and no GCS retirement exists on this branch.
#
# Stage 1 modes (input `mode`; the MUTATING ones are OBSOLETE here and refused before SSH):
#   preflight          READ-ONLY final preflight against the fixed baselines
#   schema_apply       MUTATION: fresh verified backup → migrate image from
#                      exactly eb2edb0 → api stopped (EXIT trap restarts it) →
#                      drizzle-kit push allow-listed to the 5 accepted
#                      statements → verify → second push no-op → OLD api
#                      restarted and healthy → unchanged-state proof
#   postdeploy_verify  after deploy-dev-vps deployed eb2edb0: READ-ONLY
#                      verification → disposable smoke (first-party upload /
#                      download contract, branding logo, api recreation) →
#                      settle + guarded cleanup (always-step)
#   incident_diagnose  READ-ONLY evidence after a failed postdeploy_verify
#   residue_settle     MUTATION, incident-specific (run 37930815158): recovery of
#                      the ONE recorded tombstone — read-only eligibility proof →
#                      generation-conditioned provider delete → absence proof →
#                      allow-listed row removal → read-only final verification
#                      (always). The manifest is a constant; the smoke-settle and
#                      cleanup phases are NOT used by this mode. COMPLETE (run
#                      37999992533); retained unchanged, answers STATE C.
#   residue_inspect_4fff751a3395
#                      READ-ONLY, incident-specific (run 38005492289): the full
#                      eligibility proof for the THREE recorded tombstones of the
#                      disposable company 49 (document e3f7f5fd…, branding logos
#                      f45d91c9… and 665f114f…) — reports the per-row state,
#                      changes nothing. The minimum inspection before any recovery.
#   residue_settle_4fff751a3395
#                      MUTATION, incident-specific (run 38005492289): per row and in
#                      a fixed order — eligibility (re-read in the same session) →
#                      generation-conditioned provider delete of the marked object →
#                      absence proof at every persisted location → allow-listed,
#                      row-locked removal of THAT row only → read-only final
#                      verification (always). Partial progress is safe: a row is
#                      removed only after its own object is proven absent; a later
#                      run resumes from the per-row state (A = object present,
#                      B = object absent, row present; C = nothing left).
#   b25phys_inspect    READ-ONLY, physical-test residue (company 53 "B25 Physical
#                      Android Test 20261015", its dedicated test admin, event,
#                      contact 22, document 6, storage row f048b5d4…): enumerates
#                      the exact rows, catalog-driven dependency counts, provider
#                      metadata (two immediate reads) and job state, recomputes
#                      the census and decides B25_PHYSICAL_SETTLEMENT_ELIGIBLE.
#                      The manifest is a readonly constant of apply-lib — NO input
#                      reaches it (the step passes no ARG). There is NO settle mode
#                      for this manifest; adding one is a separate reviewed change.
#   b25phys_postdelete_verify
#                      READ-ONLY, after the real platform owner deleted company 53 in
#                      the Platform portal: cascade absent and unreferenced, the
#                      storage.purgeCompany job completed (waited for read-only, never
#                      enqueued), the product tombstone (deleted / LEGACY_RETAINED),
#                      the RETAINED provider object with the proven generation digest,
#                      inventory unchanged (5 / 1398 / 1); decides
#                      B25_POSTDELETE_PROVIDER_SETTLEMENT_ELIGIBLE. No input used.
#
# SMOKE CORRECTION (run 38005492289 failed its leak gate): the smoke never places a
# genuine capability in a URL any more (synthetic probe value only), the gate uses a
# TOKEN-SPECIFIC detector (the capability's signature component) instead of the shared
# 16-character prefix, and the detector reaches the host ONLY as the first line of the
# SSH stdin stream (a shell variable of the streamed script) — never an SSH argument,
# never a URL, never an artifact, never SQL text; it is masked on the runner first.
# Every mutation mode requires the typed confirmations below; they are compared
# against fixed constants BEFORE any SSH session is opened. No input ever reaches
# a shell as text — inputs are mapped through `env:` and only compared.
# Secrets used (same as deploy-dev-vps.yml, nothing new):
#   VPS_HOST, VPS_PORT, VPS_USER, VPS_DEPLOY_PATH, VPS_SSH_KEY, VPS_KNOWN_HOSTS
# Scripts are streamed over SSH stdin (`bash -s`) and never stored on the VPS.
# Remove this workflow (and the branch) once Stage 1 is recorded.

name: b25-stage1-apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "STAGE 2A: stage2a_precheck (READ-ONLY pre-switch gate) | stage2a_postswitch_verify (READ-ONLY, after an authorized activation) | stage2a_activate (MUTATION: fs primary + strict mirror + legacy fallback; confirm_product_sha + confirm_window + confirm_stage2a) | stage2a_smoke (MUTATION: disposable fs + mirror smoke; confirm_product_sha + confirm_window + confirm_stage2a_smoke) | stage2a_rollback (MUTATION: explicit rollback to the bucket primary; confirm_product_sha + confirm_window + confirm_stage2a_rollback) | stage2a_residue_inspect_1c512c90f2c8 (READ-ONLY: 26-prerequisite eligibility of the EXACT residue of the failed smoke run 38847884691 — the two deleted/fs tombstones 593fd8be… and b3cf7f44… of deleted company 54; constants only, no input used) | stage2a_residue_settle_1c512c90f2c8 (MUTATION: that settlement — eligibility re-proven in the same session, fs + mirror absence re-proven per uuid, exactly the two rows removed, post-settlement proof; confirm_product_sha + confirm_window + confirm_stage2a_residue) | stage2a_residue_inspect_5d408c442c64 (READ-ONLY: 26-prerequisite eligibility of the EXACT residue of the failed corrected smoke run 38922592504 — the two deleted/fs tombstones c69a3706… and candidate 06228d82… of deleted company 56; constants only, no input used) | stage2a_residue_settle_5d408c442c64 (MUTATION: that settlement — eligibility re-proven in the same session, fs + mirror absence re-proven per uuid, exactly the two rows removed, post-settlement proof; confirm_product_sha + confirm_window + confirm_stage2a_residue2) | stage2a_residue_inspect_ec7ceda89a58 (READ-ONLY: 26-prerequisite eligibility of the EXACT residue of the Correction-3 smoke run 38958264416 — the two deleted/fs tombstones ac3c33c3… and c097cd52… of deleted company 58 — plus the retrospective incident-window proof of the existing tenant and the temporary-stderr metadata; constants only, no input used) | stage2a_residue_settle_ec7ceda89a58 (MUTATION: that settlem