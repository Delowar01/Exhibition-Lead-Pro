env:
  # The branch base = the deployed product commit (B25 Stage 1 closure); the ops files are the only difference.
  BASE_SHA: e559b0024b28d4a77becdcb10c4168004dddea75
  # B25 STAGE 2A — locked product commit and the typed confirmations of the three mutation modes. The activation
  # configuration itself (driver fs, root /data/objects, fallback true, mirror gcs, legacy delete false) is a
  # constant of the streamed scripts: no input, secret or environment value can supply a driver, a root or a key.
  STAGE2A_PRODUCT_SHA: e559b0024b28d4a77becdcb10c4168004dddea75
  REQUIRED_STAGE2A: "ACTIVATE_B25_STAGE2A_FS_MIRROR_GCS"
  REQUIRED_STAGE2A_SMOKE: "RUN_B25_STAGE2A_DISPOSABLE_SMOKE"
  REQUIRED_STAGE2A_ROLLBACK: "ROLLBACK_B25_STAGE2A_TO_GCS"
  # STAGE 2A CORRECTION 1 — the EXACT residue of the failed smoke run 38847884691 (tag 1c512c90f2c8): two plain
  # `deleted` fs tombstones of deleted company 54 (document 593fd8be…, branding_logo b3cf7f44…). The manifest
  # (uuids | companies 54,55 | owner user 101 | tag) is a READONLY CONSTANT of b25-stage1-apply-lib.sh (S2AR_*):
  # the two residue modes pass NO ARG, so no input can redirect them. The Stage 1 exception (f048b5d4…,
  # company 53) is denied by constant in the library, the allow-list and every predicate.
  REQUIRED_STAGE2A_RESIDUE: "SETTLE_B25_STAGE2A_RESIDUE_1c512c90f2c8"
  # STAGE 2A CORRECTION 2 — the EXACT residue of the failed corrected smoke run 38922592504 (tag 5d408c442c64):
  # two plain `deleted` fs tombstones of deleted company 56 (document c69a3706…, branding_logo candidate
  # 06228d82… reconstructed from the masked log — the hosted eligibility must prove it). Constants of
  # b25-stage1-apply-lib.sh (S2AR2_*); the two modes pass NO ARG. Distinct markers: B25_STAGE2A_RESIDUE2_*.
  REQUIRED_STAGE2A_RESIDUE2: "SETTLE_B25_STAGE2A_RESIDUE_5d408c442c64"
  # STAGE 2A CORRECTION 4 — the EXACT residue of the Correction-3 smoke run 38958264416 (tag ec7ceda89a58): two plain
  # `deleted` fs tombstones of deleted company 58 (document ac3c33c3…, branding_logo c097cd52…; both read unmasked
  # from the run log). Constants of b25-stage1-apply-lib.sh (S2AR3_*, including the recorded pre-smoke snapshot of
  # the existing tenant); the two modes pass NO ARG. Distinct markers: B25_STAGE2A_RESIDUE3_*. The same correction
  # gives the smoke's recreate step the MID-SMOKE form of the switched guard (the smoke rows travel on stdin only).
  REQUIRED_STAGE2A_RESIDUE3: "SETTLE_B25_STAGE2A_RESIDUE_ec7ceda89a58"
  # STAGE 2A CORRECTION 7 — the EXACT residue of the Correction-6 final smoke run 39880703889 (job 120177129536, tag
  # 2c4bfb197fd4): two `deleted` fs tombstones of deleted company 60 (document 04769ee1…, branding_logo 6f2594d8…; both
  # read unmasked from the run log). Constants of b25-stage1-apply-lib.sh (S2AR4_*, including the pre-smoke record of the
  # protected customer set); the two modes pass NO ARG. Distinct markers: B25_STAGE2A_RESIDUE4_*. The read-only mode
  # decides ELIGIBLE (rows present, file + mirror proven absent) or ALREADY_ABSENT (rows gone, canonical locations proven
  # empty); the settle removes exactly the two rows or skips an already-absent residue. Nothing is dispatched by this commit.
  REQUIRED_STAGE2A_RESIDUE4: "SETTLE_B25_STAGE2A_RESIDUE_2c4bfb197fd4"
  EXPECTED_HOSTED_SHA: eb2edb0ad84d859b66efbc24ea9b895f76c2ed02
  EXPECTED_PREVIOUS_SHA: 5a072fdc50e3448bd548574698f81076191cd9bc
  FP_BEFORE: ce55dfa2959cc89c2baad2923217842a
  FP_AFTER: 30c4ecbd867cd2cd59abcb58581ecb04
  REQUIRED_STAGE1: "I APPROVE B25 STAGE 1 SCHEMA APPLY"
  REQUIRED_MOBILE: "ALL FILE-TRANSFER DEVICES USE APK 346a24c1"
  REQUIRED_WINDOW: "NO-UPLOAD MAINTENANCE WINDOW ACTIVE"
  REQUIRED_ROLLBACK: "NATIVE-HANDLE ROLLBACK LIMIT ACCEPTED"
  REQUIRED_SMOKE: "RUN DISPOSABLE SMOKE"
  REQUIRED_RESIDUE: "SETTLE RECORDED SMOKE RESIDUE 8c91bc11"
  # residue_settle is INCIDENT-SPECIFIC: the one tombstone left by run 37930815158 (row uuid | disposable company ids |
  # disposable user ids | smoke tag). It is a constant here AND in the script (RESIDUE_MANIFEST); any other value is
  # refused before an SSH session is opened. Accepted ORIGINAL inventory after the recovery: 4 objects / 1299 bytes /
  # c1b900fd509bafa1f980d863dc0d195b (constant in the script).
  RESIDUE_MANIFEST: "8c91bc11-912a-42e7-abe1-37ddd95d3cc1|47,48|88,89,90,91|8f07767767cc"
  # Second incident (run 38005492289, smoke tag 4fff751a3395): THREE tombstones of the disposable company 49
  # (document e3f7f5fd…, branding logos f45d91c9… and 665f114f…; all deleted / LEGACY_RETAINED / gcs, no mirror,
  # no lease, no uncertainty), disposable companies 49 and 50, the ONE recorded disposable user id (92, the
  # platform-owner principal; the three tenant users were removed by the API's company deletion and their ids
  # were never recorded — they are checked by address pattern only, never guessed). Constant here AND in the
  # script (R2_MANIFEST); any other value is refused before an SSH session is opened.
  RESIDUE2_MANIFEST: "e3f7f5fd-bbbe-4d7c-9111-4dfe6bef2daf,f45d91c9-2e2c-4c38-a97c-b3f95aa507e3,665f114f-e100-4301-95e0-ad6a18eeae03|49,50|92|4fff751a3395"
  REQUIRED_RESIDUE2: "SETTLE RECORDED SMOKE RESIDUE 4fff751a3395"

jobs:
  stage1:
    name: "B25 Stage 2A — ${{ inputs.mode }}"
    if: github.ref == 'refs/heads/ops/b25-stage2a-fs-activation-tooling' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard — branch content = accepted commit + the three ops files; scripts parse
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}" || { echo "base commit not present"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo "branch does not descend from the base commit"; exit 1; }
          DIFF="$(git diff --stat "$BASE_SHA" HEAD -- . ':(exclude).github/scripts/b25-stage1-apply.sh' ':(exclude).github/scripts/b25-stage1-apply-lib.sh' ':(exclude).github/scripts/b25-stage1-purge-lib.sh' ':(exclude).github/scripts/b25-stage1-cleanup.test.sh' ':(exclude).github/scripts/b25-stage1-smoke.mjs' ':(exclude).github/workflows/b25-stage1-inspection.yml')"
          [ -z "$DIFF" ] || { echo "branch differs from the base commit outside the ops files:"; echo "$DIFF"; exit 1; }
          [ "$(git diff --name-only "$BASE_SHA" HEAD -- .github/workflows | wc -l)" = "1" ] || { echo "more than one workflow file differs from the base commit"; exit 1; }
          bash -n .github/scripts/b25-stage1-purge-lib.sh
          bash -n .github/scripts/b25-stage1-apply-lib.sh
          bash -n .github/scripts/b25-stage1-apply.sh
          bash -n .github/scripts/b25-stage1-cleanup.test.sh
          node --check .github/scripts/b25-stage1-smoke.mjs
          grep -q 'default_transaction_read_only = on' .github/scripts/b25-stage1-apply.sh || { echo "read-only session guard missing"; exit 1; }
          grep -q 'trap on_exit_schema EXIT' .github/scripts/b25-stage1-apply.sh || { echo "EXIT trap missing"; exit 1; }
          grep -q '^purge_rows_sql()' .github/scripts/b25-stage1-purge-lib.sh || { echo "purge library incomplete"; exit 1; }
          grep -q '^push_allowlist_check()' .github/scripts/b25-stage1-apply-lib.sh || { echo "apply library incomplete"; exit 1; }
          grep -q '^stage2a_purge_rows_sql()' .github/scripts/b25-stage1-purge-lib.sh || { echo "stage 2a purge rule missing"; exit 1; }
          grep -q '^stage2a_precheck_eligibility()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_postswitch_eligibility()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_env_render()' .github/scripts/b25-stage1-apply-lib.sh || { echo "stage 2a library incomplete"; exit 1; }
          grep -q '^stage2a_residue_eligibility()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_residue_settled()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2AR_MANIFEST=' .github/scripts/b25-stage1-apply-lib.sh || { echo "stage 2a residue library incomplete"; exit 1; }
          grep -q '^stage2a_residue2_eligibility()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_residue2_settled()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2AR2_MANIFEST=' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^function servedLogoRule(' .github/scripts/b25-stage1-smoke.mjs || { echo "stage 2a correction 2 tooling incomplete"; exit 1; }
          grep -q '^phase_stage2a_tenant_drift()' .github/scripts/b25-stage1-apply.sh && grep -q '^S2A_TENANT_LAST_MATCH=' .github/scripts/b25-stage1-apply.sh || { echo "stage 2a tenant drift localization incomplete"; exit 1; }
          grep -q '^stage2a_tenant_start_eval()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_tenant_post_eval()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2A_TENANT_REVIEW_UTC=' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_tenant_start_gate()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_tenant_post_gate()' .github/scripts/b25-stage1-apply.sh || { echo "stage 2a correction 3 tenant safety model incomplete"; exit 1; }
          if awk '/^(guards_stage2a_switched|phase_stage2a_smoke_setup|phase_stage2a_cleanup)\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply.sh | grep -q 'TENANT_BASELINE_MD5'; then echo "the frozen whole-tenant digest is still a Stage 2A gate"; exit 1; fi
          grep -q '^stage2a_residue3_eligibility()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_residue3_settled()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2AR3_MANIFEST=' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2AR3_TENANT_SNAPSHOT_B64=' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_midsmoke_eval()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^guards_stage2a_switched_with_smoke_rows()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_tenant_incident_proof()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_tmp_stderr_facts()' .github/scripts/b25-stage1-apply.sh || { echo "stage 2a correction 4 tooling incomplete"; exit 1; }
          if awk '/^phase_stage2a_recreate_api\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply.sh | grep -qE '^  guards_stage2a_switched$'; then echo "the recreate phase still applies the pre-smoke form of the switched guard"; exit 1; fi
          # Correction 5: the protected live-inventory model must be present, the exception-only inventory / locked census
          # rules gone from every Stage 2A smoke gate, and the read-only inspection phase registered
          grep -q '^references_legacy()' .github/scripts/b25-stage1-apply.sh && grep -q '^references_ambiguous()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_live_row_sql()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_assoc_sql()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_protected_facts()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_protected_gate()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_protected_record_line()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_protected_recorded_facts()' .github/scripts/b25-stage1-apply.sh && grep -q '^phase_stage2a_protected_inventory_inspect()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_protected_eval()' .github/scripts/b25-stage1-apply-lib.sh || { echo "the Correction 5 protected live-inventory functions are missing"; exit 1; }
          if awk '/^(guards_stage2a_switched|phase_stage2a_smoke_setup|phase_stage2a_smoke_verify|phase_stage2a_smoke_settle|phase_stage2a_cleanup)\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply.sh | grep -qE 'B25PHYS_CENSUS_MD5|from storage_objects")" = "1" \]'; then echo "an exception-only inventory / locked census rule is still a Stage 2A smoke gate"; exit 1; fi
          if awk '/^(stage2a_protected_inventory_run|phase_stage2a_protected_inventory_inspect|stage2a_protected_facts|stage2a_protected_gate)\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply.sh | grep -qE '(^|[^a-z_])qw |purge_rows_sql|stage2a_env_apply|stage2a_recreate_api|compose (up|down|rm|restart|stop|kill)'; then echo "the protected inventory inspection is not read-only"; exit 1; fi
          # Correction 6: the company-row attribution must be present, anchored to the reviewed historical snapshot (the review instant
          # is never advanced, no digest replaced), and the read-only company-change inspection registered and never writing
          grep -q '^stage2a_company_change_classify()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^s2a_c6_constants_ok()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2A_C6_ANCHOR_RUN="38958264416"' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2A_C6_ANCHOR_B64="\$S2AR3_TENANT_SNAPSHOT_B64"' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_company_change_facts()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_company_change_run()' .github/scripts/b25-stage1-apply.sh && grep -q '^phase_stage2a_company_change_inspect()' .github/scripts/b25-stage1-apply.sh || { echo "stage 2a correction 6 (company-row attribution) incomplete"; exit 1; }
          grep -q '^readonly S2A_TENANT_REVIEW_UTC="2026-10-16 15:17:33"' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2AR3_SNAPSHOT_AT="2026-10-16 19:54:40.127290"' .github/scripts/b25-stage1-apply-lib.sh || { echo "the review instant or the historical anchor was changed outside review"; exit 1; }
          if awk '/^(stage2a_company_change_facts|stage2a_company_change_run|phase_stage2a_company_change_inspect)\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply.sh | grep -qE '(^|[^a-z_])qw |purge_rows_sql|stage2a_env_apply|stage2a_recreate_api|compose (up|down|rm|restart|stop|start|exec -T api sh -c .(rm|mv|cp|tee|chmod|chown))|ARG[123]|inputs\.'; then echo "the company-change reader / inspection writes or reads an input"; exit 1; fi
          # Correction 7: the same-run smoke allowance, the form-aware record comparison and the residue-4 tooling must be present;
          # the protected live-row predicate must keep its smoke-tenant exclusion; no evaluator verdict may be assigned in the
          # plain form that set -e can abort before printing; the residue-4 inspection must never write or read an input
          grep -q '^stage2a_smoke_row_sql()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_smoke_logo_sql()' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_smoke_csv_q()' .github/scripts/b25-stage1-apply.sh && grep -q 'tenant_live_keys_md5' .github/scripts/b25-stage1-apply.sh && grep -q 'tenant_live_keys_md5' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_residue4_eligibility()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^stage2a_residue4_settled()' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2AR4_MANIFEST=' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^phase_stage2a_residue4_eligibility()' .github/scripts/b25-stage1-apply.sh && grep -q '^phase_stage2a_residue4_settle()' .github/scripts/b25-stage1-apply.sh || { echo "stage 2a correction 7 tooling incomplete"; exit 1; }
          if ! awk '/^stage2a_live_row_sql\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply.sh | grep -q "lc.name not like 'B25 SMOKE %'"; then echo "the protected live-row predicate lost its smoke-tenant exclusion"; exit 1; fi
          # Correction 8: the post-switch error-level condition must classify parsed records (never the raw count alone), bound to the constant smoke run / companies / window; the classifier runs in the container over stdin; the teardown never probes a tenant it already deleted
          grep -q '^readonly S2A_C8_SMOKE_RUN=39905712331$' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^readonly S2A_C8_COMPANIES="62,63"$' .github/scripts/b25-stage1-apply-lib.sh && grep -q '^s2a_c8_constants_ok()' .github/scripts/b25-stage1-apply-lib.sh || { echo "Correction 8 constants missing"; exit 1; }
          grep -q '^STAGE2A_LOG_CLASSIFY_JS=' .github/scripts/b25-stage1-apply.sh && grep -q '^stage2a_log_classify_facts()' .github/scripts/b25-stage1-apply.sh && grep -q '^api_node_stdin()' .github/scripts/b25-stage1-apply.sh || { echo "Correction 8 classifier missing"; exit 1; }
          awk '/^stage2a_postswitch_eligibility\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply-lib.sh | grep -q 'is_zero log_unclassified_level50 && is_zero log_duplicate_records' || { echo "post-switch condition 13 does not fail closed on unclassified error records"; exit 1; }
          awk '/^stage2a_postswitch_eligibility\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply-lib.sh | grep -q 'is_eq log_level50 "$(g log_level50_total)"' || { echo "post-switch condition 13 does not reconcile the raw and parsed error counts"; exit 1; }
          if awk '/^STAGE2A_LOG_CLASSIFY_JS=/{on=1} on{print} on&&/^JS$/{on=0}' .github/scripts/b25-stage1-apply.sh | grep -qE 'console\.log\((line|raw|rec|txt)\b|JSON\.stringify\((rec|recs|line|txt)\)'; then echo "the log classifier prints record text"; exit 1; fi
          grep -q 'deleted.includes(cid)' .github/scripts/b25-stage1-smoke.mjs && grep -q 's.deleted = Array.from(new Set(' .github/scripts/b25-stage1-smoke.mjs || { echo "the smoke teardown still probes deleted tenants"; exit 1; }
          if grep -qE '^\s*(local verdict; )?verdict="\$\(printf [^|]*\| [a-z0-9_]+( [^)]*)?\)"; printf' .github/scripts/b25-stage1-apply.sh; then echo "an evaluator verdict is still assigned in the plain form (set -e could abort before it is printed)"; exit 1; fi
          if awk '/^(stage2a_residue4_row_facts|stage2a_residue4_blobs|stage2a_residue4_protected_facts|stage2a_residue4_eligibility_run)\(\) \{/{on=1} on{print} on&&/^}$/{on=0}' .github/scripts/b25-stage1-apply.sh | grep -qE '(^|[^a-z_])qw |purge_rows_sql|stage2a_env_apply|stage2a_recreate_api|compose (up|down|rm|restart|stop|start)|ARG[123]|inputs\.'; then echo "the residue-4 inspection is not read-only or reads an input"; exit 1; fi
          if grep -qE 'migrate.storage|--dry-run|--copy|--verify' .github/scripts/b25-stage1-apply.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-purge-lib.sh; then echo "a migration wrapper is present on the Stage 2A tooling branch"; exit 1; fi
          echo "branch = $BASE_SHA + ops files only; workflow served from the registered path"

      - name: Validate inputs (exact comparison; nothing is executed from an input)
        env:
          MODE: ${{ inputs.mode }}
          IN_SHA: ${{ inputs.confirm_accepted_sha }}
          IN_HOSTED: ${{ inputs.confirm_hosted_sha }}
          IN_FP: ${{ inputs.confirm_fingerprint }}
          IN_STAGE1: ${{ inputs.confirm_stage1 }}
          IN_MOBILE: ${{ inputs.confirm_mobile }}
          IN_WINDOW: ${{ inputs.confirm_window }}
          IN_ROLLBACK: ${{ inputs.confirm_rollback }}
          IN_SMOKE: ${{ inputs.confirm_smoke }}
          IN_DW1: ${{ inputs.diag_window_start }}
          IN_DW2: ${{ inputs.diag_window_end }}
          IN_DRES: ${{ inputs.diag_residue }}
          IN_RESIDUE: ${{ inputs.confirm_residue }}
          IN_PRODUCT_SHA: ${{ inputs.confirm_product_sha }}
          IN_STAGE2A: ${{ inputs.confirm_stage2a }}
          IN_STAGE2A_SMOKE: ${{ inputs.confirm_stage2a_smoke }}
          IN_STAGE2A_ROLLBACK: ${{ inputs.confirm_stage2a_rollback }}
          IN_STAGE2A_RESIDUE: ${{ inputs.confirm_stage2a_residue }}
          IN_STAGE2A_RESIDUE2: ${{ inputs.confirm_stage2a_residue2 }}
          IN_STAGE2A_RESIDUE3: ${{ inputs.confirm_stage2a_residue3 }}
          IN_STAGE2A_RESIDUE4: ${{ inputs.confirm_stage2a_residue4 }}
        run: |
          set -euo pipefail
          case "$MODE" in stage2a_precheck|stage2a_postswitch_verify|stage2a_activate|stage2a_smoke|stage2a_rollback|stage2a_residue_inspect_1c512c90f2c8|stage2a_residue_settle_1c512c90f2c8|stage2a_residue_inspect_5d408c442c64|stage2a_residue_settle_5d408c442c64|stage2a_residue_inspect_ec7ceda89a58|stage2a_residue_settle_ec7ceda89a58|stage2a_residue_inspect_2c4bfb197fd4|stage2a_residue_settle_2c4bfb197fd4|stage2a_tenant_drift_inspect|stage2a_protected_inventory_inspect|stage2a_company_change_inspect|preflight|schema_apply|postdeploy_verify|incident_diagnose|residue_settle|residue_inspect_4fff751a3395|residue_settle_4fff751a3395|b25phys_inspect|b25phys_postdelete_verify) ;; *) echo "::error::unknown mode"; exit 1;; esac
          # STAGE 2A TOOLING BRANCH: every Stage 1 MUTATION mode (schema phases pinned to eb2edb0, the 72a2437
          # post-deployment smoke, the two incident recoveries) is complete and pinned to earlier product commits;
          # they are refused here BEFORE any SSH session, not left to a later guard on the host.
          case "$MODE" in preflight|schema_apply|postdeploy_verify|residue_settle|residue_settle_4fff751a3395) echo "::error::mode '$MODE' is obsolete on the Stage 2A tooling branch (Stage 1 is closed; its mutation phases are pinned to earlier product commits)"; exit 1;; esac
          need() { [ "$2" = "$3" ] || { echo "::error::confirmation '$1' does not match the required value"; exit 1; }; }
          empty() { [ -z "$2" ] || { echo "::error::$1 must be empty for mode $MODE"; exit 1; }; }
          # Stage 2A: the three mutation confirmations are mutually exclusive — exactly the one of the chosen mode may
          # be typed; the read-only modes refuse every confirmation; nothing typed ever reaches a shell as text.
          case "$MODE" in
            stage2a_precheck|stage2a_postswitch_verify|stage2a_residue_inspect_1c512c90f2c8|stage2a_residue_inspect_5d408c442c64|stage2a_residue_inspect_ec7ceda89a58|stage2a_residue_inspect_2c4bfb197fd4|stage2a_tenant_drift_inspect|stage2a_protected_inventory_inspect|stage2a_company_change_inspect)
              empty confirm_product_sha "$IN_PRODUCT_SHA"; empty confirm_stage2a "$IN_STAGE2A"; empty confirm_stage2a_smoke "$IN_STAGE2A_SMOKE"; empty confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK"; empty confirm_window "$IN_WINDOW"; empty confirm_residue "$IN_RESIDUE"; empty confirm_stage2a_residue "$IN_STAGE2A_RESIDUE"; empty confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2"; empty confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3"; empty confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" ;;
            stage2a_activate)
              need confirm_product_sha "$IN_PRODUCT_SHA" "$STAGE2A_PRODUCT_SHA"; need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"; need confirm_stage2a "$IN_STAGE2A" "$REQUIRED_STAGE2A"
              empty confirm_stage2a_smoke "$IN_STAGE2A_SMOKE"; empty confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK"; empty confirm_residue "$IN_RESIDUE"; empty confirm_stage2a_residue "$IN_STAGE2A_RESIDUE"; empty confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2"; empty confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3"; empty confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" ;;
            stage2a_smoke)
              need confirm_product_sha "$IN_PRODUCT_SHA" "$STAGE2A_PRODUCT_SHA"; need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"; need confirm_stage2a_smoke "$IN_STAGE2A_SMOKE" "$REQUIRED_STAGE2A_SMOKE"
              empty confirm_stage2a "$IN_STAGE2A"; empty confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK"; empty confirm_residue "$IN_RESIDUE"; empty confirm_stage2a_residue "$IN_STAGE2A_RESIDUE"; empty confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2"; empty confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3"; empty confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" ;;
            stage2a_rollback)
              need confirm_product_sha "$IN_PRODUCT_SHA" "$STAGE2A_PRODUCT_SHA"; need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"; need confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK" "$REQUIRED_STAGE2A_ROLLBACK"
              empty confirm_stage2a "$IN_STAGE2A"; empty confirm_stage2a_smoke "$IN_STAGE2A_SMOKE"; empty confirm_residue "$IN_RESIDUE"; empty confirm_stage2a_residue "$IN_STAGE2A_RESIDUE"; empty confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2"; empty confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3"; empty confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" ;;
            stage2a_residue_settle_1c512c90f2c8)
              # CORRECTION 1 MUTATION, incident-specific: the locked product commit, the maintenance window and the
              # incident-bound confirmation are required; the residue itself is a constant of the scripts (no input).
              need confirm_product_sha "$IN_PRODUCT_SHA" "$STAGE2A_PRODUCT_SHA"; need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"; need confirm_stage2a_residue "$IN_STAGE2A_RESIDUE" "$REQUIRED_STAGE2A_RESIDUE"
              empty confirm_stage2a "$IN_STAGE2A"; empty confirm_stage2a_smoke "$IN_STAGE2A_SMOKE"; empty confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK"; empty confirm_residue "$IN_RESIDUE"; empty confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2"; empty confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3"; empty confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" ;;
            stage2a_residue_settle_5d408c442c64)
              # CORRECTION 2 MUTATION, incident-specific: the locked product commit, the maintenance window and the
              # incident-bound confirmation are required; the residue itself is a constant of the scripts (no input).
              need confirm_product_sha "$IN_PRODUCT_SHA" "$STAGE2A_PRODUCT_SHA"; need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"; need confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2" "$REQUIRED_STAGE2A_RESIDUE2"
              empty confirm_stage2a "$IN_STAGE2A"; empty confirm_stage2a_smoke "$IN_STAGE2A_SMOKE"; empty confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK"; empty confirm_residue "$IN_RESIDUE"; empty confirm_stage2a_residue "$IN_STAGE2A_RESIDUE"; empty confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3"; empty confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" ;;
            stage2a_residue_settle_ec7ceda89a58)
              # CORRECTION 4 MUTATION, incident-specific: the locked product commit, the maintenance window and the
              # incident-bound confirmation are required; the residue itself is a constant of the scripts (no input).
              need confirm_product_sha "$IN_PRODUCT_SHA" "$STAGE2A_PRODUCT_SHA"; need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"; need confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3" "$REQUIRED_STAGE2A_RESIDUE3"
              empty confirm_stage2a "$IN_STAGE2A"; empty confirm_stage2a_smoke "$IN_STAGE2A_SMOKE"; empty confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK"; empty confirm_residue "$IN_RESIDUE"; empty confirm_stage2a_residue "$IN_STAGE2A_RESIDUE"; empty confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2"; empty confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" ;;
            stage2a_residue_settle_2c4bfb197fd4)
              # CORRECTION 7 MUTATION, incident-specific: the locked product commit, the maintenance window and the
              # incident-bound confirmation are required; the residue itself is a constant of the scripts (no input).
              need confirm_product_sha "$IN_PRODUCT_SHA" "$STAGE2A_PRODUCT_SHA"; need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"; need confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" "$REQUIRED_STAGE2A_RESIDUE4"
              empty confirm_stage2a "$IN_STAGE2A"; empty confirm_stage2a_smoke "$IN_STAGE2A_SMOKE"; empty confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK"; empty confirm_residue "$IN_RESIDUE"; empty confirm_stage2a_residue "$IN_STAGE2A_RESIDUE"; empty confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2"; empty confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3" ;;
            *)
              empty confirm_stage2a "$IN_STAGE2A"; empty confirm_stage2a_smoke "$IN_STAGE2A_SMOKE"; empty confirm_stage2a_rollback "$IN_STAGE2A_ROLLBACK"; empty confirm_stage2a_residue "$IN_STAGE2A_RESIDUE"; empty confirm_stage2a_residue2 "$IN_STAGE2A_RESIDUE2"; empty confirm_stage2a_residue3 "$IN_STAGE2A_RESIDUE3"; empty confirm_stage2a_residue4 "$IN_STAGE2A_RESIDUE4" ;;
          esac
          if [ "$MODE" = "schema_apply" ]; then
            need confirm_accepted_sha "$IN_SHA" "$BASE_SHA"
            need confirm_hosted_sha "$IN_HOSTED" "$EXPECTED_HOSTED_SHA"
            need confirm_fingerprint "$IN_FP" "$FP_BEFORE"
            need confirm_stage1 "$IN_STAGE1" "$REQUIRED_STAGE1"
            need confirm_mobile "$IN_MOBILE" "$REQUIRED_MOBILE"
            need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"
            need confirm_rollback "$IN_ROLLBACK" "$REQUIRED_ROLLBACK"
          elif [ "$MODE" = "postdeploy_verify" ]; then
            need confirm_accepted_sha "$IN_SHA" "$BASE_SHA"
            need confirm_mobile "$IN_MOBILE" "$REQUIRED_MOBILE"
            need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"
            need confirm_rollback "$IN_ROLLBACK" "$REQUIRED_ROLLBACK"
            need confirm_smoke "$IN_SMOKE" "$REQUIRED_SMOKE"
          elif [ "$MODE" = "incident_diagnose" ]; then
            # read-only mode: no confirmation strings; the three diagnostic inputs are shape-checked here and
            # again inside the script before use (they only become docker --since/--until values and SQL literals)
            TS='^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
            [[ "$IN_DW1" =~ $TS ]] && [[ "$IN_DW2" =~ $TS ]] || { echo "::error::diag_window_start / diag_window_end must be UTC timestamps YYYY-MM-DDTHH:MM:SSZ"; exit 1; }
            [[ "$IN_DRES" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\|[0-9]+(,[0-9]+)*\|[0-9]+(,[0-9]+)*\|[a-z0-9]{6,12}$ ]] || { echo "::error::diag_residue must be <uuid>|<csv company ids>|<csv user ids>|<tag>"; exit 1; }
          elif [ "$MODE" = "residue_settle" ]; then
            # MUTATION, incident-specific: the accepted (currently hosted) product commit, the maintenance window and
            # the incident-bound confirmation are all required; the manifest is NOT an input (RESIDUE_MANIFEST is a
            # constant; the diag_residue input must still equal it so a stale or foreign manifest is refused here).
            need confirm_accepted_sha "$IN_SHA" "$BASE_SHA"
            need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"
            need confirm_residue "$IN_RESIDUE" "$REQUIRED_RESIDUE"
            need diag_residue "$IN_DRES" "$RESIDUE_MANIFEST"
          elif [ "$MODE" = "residue_inspect_4fff751a3395" ]; then
            # READ-ONLY: no mutation confirmation; the typed manifest must still equal the second incident's constant
            need diag_residue "$IN_DRES" "$RESIDUE2_MANIFEST"
          elif [ "$MODE" = "residue_settle_4fff751a3395" ]; then
            # MUTATION, incident-specific (second incident): accepted product commit, maintenance window and the
            # incident-bound confirmation are required; the manifest is a constant (RESIDUE2_MANIFEST) and the
            # typed diag_residue must equal it so a stale or foreign manifest is refused here.
            need confirm_accepted_sha "$IN_SHA" "$BASE_SHA"
            need confirm_window "$IN_WINDOW" "$REQUIRED_WINDOW"
            need confirm_residue "$IN_RESIDUE" "$REQUIRED_RESIDUE2"
            need diag_residue "$IN_DRES" "$RESIDUE2_MANIFEST"
          elif [ "$MODE" = "b25phys_inspect" ] || [ "$MODE" = "b25phys_postdelete_verify" ]; then
            # READ-ONLY: no confirmation string, and NO input is used at all — the manifest (company 53, user 100,
            # event 17, contact 22, document 6, storage row f048b5d4…) is a readonly constant of
            # b25-stage1-apply-lib.sh and the SSH steps below pass no ARG. A typed mutation confirmation is refused
            # so these modes can never be mistaken for one.
            [ -z "$IN_RESIDUE" ] || { echo "::error::$MODE is read-only — confirm_residue must be empty"; exit 1; }
          fi
          echo "mode=$MODE confirmations=ok"

      - name: Validate secrets shape (values never printed)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::VPS_DEPLOY_PATH has an unexpected shape"; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::VPS_PORT has an unexpected shape"; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::VPS_HOST has an unexpected shape"; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::VPS_USER has an unexpected shape"; exit 1; }
          [ -n "$VPS_SSH_KEY" ] && [ -n "$VPS_KNOWN_HOSTS" ] || { echo "::error::SSH secrets missing"; exit 1; }
          echo "secrets present and well-formed"

      - name: No other activation or deployment may be queued or running (registered ids, verified path, fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Coordination-relevant workflows = every registered workflow that can deploy, activate or reach
          # the VPS: registered numeric id -> expected path. Each id is resolved through the registry
          # (id, path, state=active) BEFORE its runs are read; anything else stops the job.
          ALLOW=(
            "338196147=.github/workflows/deploy-dev-vps.yml"
            "358860432=.github/workflows/b20-hosted-activation.yml"
            "376505024=.github/workflows/b25-stage1-inspection.yml"
            "373189055=.github/workflows/b25-hosted-inspection.yml"
            "348767584=.github/workflows/b14-hosted-activation.yml"
            "350570859=.github/workflows/b15-schema-activation.yml"
            "352288831=.github/workflows/b16-hosted-activation.yml"
            "353075182=.github/workflows/b17-hosted-activation.yml"
            "353427348=.github/workflows/b18-hosted-activation.yml"
            "354083606=.github/workflows/b20-hosted-inspection.yml"
          )
          # Registered workflows documented as NOT sharing the deployment / activation boundary (their runs
          # are not counted): backup-health-alert is the scheduled read-only backup check with its own
          # concurrency group "backup-health-alert"; it never runs compose, docker, deploy or SQL.
          KNOWN_OTHER=(
            "365534673=.github/workflows/backup-health-alert.yml"
          )
          RELEVANT='deploy|activation|inspection|stage1|stage-1'
          [[ "$THIS_RUN" =~ ^[0-9]+$ ]] || { echo "::error::current run id is malformed"; exit 1; }
          [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::repository name is malformed"; exit 1; }
          # GET only. On ANY failure (non-2xx such as 403 / 404 / 429 / 5xx, network or command error,
          # empty body, invalid JSON) nothing of the response is printed, the reason goes to stderr (so it
          # is never swallowed by a command substitution) and the job stops: a failed query is never "idle".
          api_get() {
            local body
            if ! body="$(gh api --method GET "$1" 2>/dev/null)"; then echo "::error::GitHub API query failed ($2)" >&2; return 1; fi
            [ -n "$body" ] || { echo "::error::empty GitHub API response ($2)" >&2; return 1; }
            printf '%s' "$body" | jq -e . >/dev/null 2>&1 || { echo "::error::GitHub API response is not valid JSON ($2)" >&2; return 1; }
            printf '%s' "$body"
          }
          num() { [[ "$1" =~ ^[0-9]+$ ]] || { echo "::error::non-numeric value where a count was expected ($2)" >&2; return 1; }; }
          # 1. Live registry: every ACTIVE registered workflow must be classified (allow-listed with the
          #    expected path, or documented as non-conflicting). An unclassified one stops the job —
          #    whether or not its name matches the coordination pattern — it is never ignored.
          reg="$(api_get "repos/$REPO/actions/workflows?per_page=100" "workflow registry")"
          total="$(printf '%s' "$reg" | jq -r '.total_count // empty')"; num "$total" "registry total_count"
          listed="$(printf '%s' "$reg" | jq -r '.workflows | length')"; num "$listed" "registry page length"
          [ "$total" = "$listed" ] || { echo "::error::workflow registry has $total entries but only $listed were returned"; exit 1; }
          [ "$listed" -gt 0 ] || { echo "::error::workflow registry is empty"; exit 1; }
          mapfile -t REG < <(printf '%s' "$reg" | jq -r '.workflows[] | "\(.id)|\(.state)|\(.path)|\(.name)"')
          for line in "${REG[@]}"; do
            IFS='|' read -r rid rstate rpath rname <<<"$line"
            num "$rid" "registry workflow id"
            [ "$rstate" = "active" ] || continue
            known=0
            for e in "${ALLOW[@]}" "${KNOWN_OTHER[@]}"; do [ "${e%%=*}" = "$rid" ] && [ "${e#*=}" = "$rpath" ] && known=1; done
            if [ "$known" = "0" ]; then
              if printf '%s %s' "$rpath" "$rname" | grep -qiE "$RELEVANT"; then kind="coordination-relevant"; else kind="unclassified"; fi
              echo "::error::$kind workflow registered but not classified for Stage 1: id $rid path $rpath"; exit 1
            fi
          done
          # 2. Each allow-listed id must resolve to its expected ACTIVE path; then its queued / in_progress /
          #    waiting runs are counted, excluding only this run id. Any other run = busy.
          busy=0
          for e in "${ALLOW[@]}"; do
            id="${e%%=*}"; path="${e#*=}"
            wf="$(api_get "repos/$REPO/actions/workflows/$id" "workflow $id")"
            rid="$(printf '%s' "$wf" | jq -r '.id // empty')"; rpath="$(printf '%s' "$wf" | jq -r '.path // empty')"; rstate="$(printf '%s' "$wf" | jq -r '.state // empty')"
            [ "$rid" = "$id" ] && [ "$rpath" = "$path" ] && [ "$rstate" = "active" ] || { echo "::error::workflow $id does not resolve to the expected active path $path"; exit 1; }
            for st in queued in_progress waiting; do
              runs="$(api_get "repos/$REPO/actions/workflows/$id/runs?status=$st&per_page=100" "runs of workflow $id in state $st")"
              n="$(printf '%s' "$runs" | jq -r '.total_count // empty')"; num "$n" "run count of workflow $id in state $st"
              mine="$(printf '%s' "$runs" | jq -r --arg me "$THIS_RUN" '[.workflow_runs[]? | select((.id|tostring) == $me)] | length')"; num "$mine" "self count"
              others=$((n - mine))
              [ "$others" = "0" ] || { echo "::error::$path has $others other run(s) in state $st"; busy=1; }
            done
          done
          [ "$busy" = "0" ] || exit 1
          echo "no concurrent activation / deployment run (${#ALLOW[@]} registered workflows verified by id, path and state)"

      - uses: pnpm/action-setup@v4
        if: inputs.mode == 'stage2a_smoke'
      - uses: actions/setup-node@v4
        if: inputs.mode == 'stage2a_smoke'
        with:
          node-version: 24.13.0
          cache: pnpm
      - name: Install (frozen lockfile; bcryptjs for the disposable owner hash)
        if: inputs.mode == 'stage2a_smoke'
        run: pnpm install --frozen-lockfile

      - name: Install SSH key and pinned host key (strict host verification; no ssh-keyscan)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  Port $VPS_PORT"
            echo "  User $VPS_USER"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  StrictHostKeyChecking yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      # ── incident_diagnose (read-only; no disposable setup, no mutation step runs in this mode) ──────
      - name: Public health from the runner (incident_diagnose; status codes and the small readiness JSON only)
        if: inputs.mode == 'incident_diagnose'
        run: |
          set -uo pipefail
          for o in https://admin.kaptnow.com https://elite.kaptnow.com; do
            for p in /healthz /api/healthz /api/readyz; do
              code="$(curl -sS --max-time 10 -o "$RUNNER_TEMP/diag-body" -w '%{http_code}' "$o$p" 2>/dev/null || echo 000)"
              body=""; [ "$p" = "/api/readyz" ] && body="$(head -c 200 "$RUNNER_TEMP/diag-body" 2>/dev/null | tr -d '\n' || true)"
              echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) $o$p -> $code $body"
            done
            echo "$o/api/healthz response headers (public layer): $(curl -sSI --max-time 10 "$o/api/healthz" 2>/dev/null | tr -d '\r' | grep -iE '^(referrer-policy|cache-control|server|via|x-powered-by|cf-cache-status|alt-svc):' | tr '\n' ' ' || echo unavailable)"
          done
          rm -f "$RUNNER_TEMP/diag-body"

      - name: Incident diagnosis (read-only; sanitized; streamed over stdin; nothing written on the host except api_node's temporary stderr file)
        if: inputs.mode == 'incident_diagnose'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          DW1: ${{ inputs.diag_window_start }}
          DW2: ${{ inputs.diag_window_end }}
          DRES: ${{ inputs.diag_residue }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='diagnose' ARG1='$DW1' ARG2='$DW2' ARG3='$DRES' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      # ── residue_settle (MUTATION; the ONE recorded tombstone of run 37930815158; no disposable setup, no smoke) ──
      # Three SSH sessions, each streamed over stdin, each re-checking the fixed manifest on the host:
      #   1. residue-eligibility  READ-ONLY full proof (host state, baselines, row identity, provider marker /
      #                           generation / size, originals intact) — fails closed BEFORE any mutation
      #   2. residue-settle       re-runs the same proof in its own session, then the two mutation points
      #                           (generation-conditioned provider delete → absence proof → allow-listed row removal)
      #   3. residue-verify       READ-ONLY final verification, always (reports and fails on any deviation; never writes)
      - name: Residue eligibility (read-only; full proof before any mutation; the manifest is a constant)
        if: inputs.mode == 'residue_settle'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='residue-eligibility' ARG1='$RESIDUE_MANIFEST' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      - name: Residue settle (MUTATION; eligibility re-read in the same session; provider delete at the exact generation → absence proof at every location → allow-listed removal of the one row)
        if: inputs.mode == 'residue_settle'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='residue-settle' ARG1='$RESIDUE_MANIFEST' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      - name: Residue verify (always; READ-ONLY final verification — reports and fails on any deviation from the accepted end state; never deletes)
        if: always() && inputs.mode == 'residue_settle'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='residue-verify' ARG1='$RESIDUE_MANIFEST' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      # ── residue_inspect_4fff751a3395 (READ-ONLY) / residue_settle_4fff751a3395 (MUTATION) — the THREE tombstones of
      #    run 38005492289. Each SSH session streams the scripts over stdin and re-checks the constant manifest on the
      #    host. The settle mode works row by row in a fixed order: provider delete at the exact generation (marker
      #    re-read in the same call) → absence proof at every persisted location → allow-listed removal of THAT row.
      - name: Residue (second incident) eligibility — READ-ONLY full proof; reports the per-row state; changes nothing
        if: inputs.mode == 'residue_inspect_4fff751a3395' || inputs.mode == 'residue_settle_4fff751a3395'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='residue2-eligibility' ARG1='$RESIDUE2_MANIFEST' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      - name: Residue (second incident) settle — MUTATION; eligibility re-read in the same session; per row — provider delete at the exact generation → absence proof → allow-listed removal of that row
        if: inputs.mode == 'residue_settle_4fff751a3395'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='residue2-settle' ARG1='$RESIDUE2_MANIFEST' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      - name: Residue (second incident) verify — always; READ-ONLY final verification; reports and fails on any deviation; never deletes
        if: always() && inputs.mode == 'residue_settle_4fff751a3395'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='residue2-verify' ARG1='$RESIDUE2_MANIFEST' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      # ── b25phys_inspect (READ-ONLY; physical-test residue; constant manifest; no ARG passed) ────────────────
      # One SSH session streaming the three scripts over stdin. The phase reads the company / users / event /
      # contact / document / storage row through read-only psql sessions, HEADs the provider object twice by its
      # stored key, lists the bucket for the census and prints the fifteen deletion prerequisites. Nothing is
      # written anywhere; there is no settle phase for this manifest.
      - name: B25 physical residue — READ-ONLY inspection (constant manifest; enumerates rows, dependencies, provider metadata, jobs, census; decides B25_PHYSICAL_SETTLEMENT_ELIGIBLE; changes nothing)
        if: inputs.mode == 'b25phys_inspect'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b25phys-inspect' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      # ── b25phys_postdelete_verify (READ-ONLY; after the operator's portal deletion of company 53; no ARG passed) ──
      - name: B25 physical residue — READ-ONLY post-delete verification (cascade absent, purge job completed, tombstone deleted/LEGACY_RETAINED, provider object retained with the proven generation, inventory unchanged; decides B25_POSTDELETE_PROVIDER_SETTLEMENT_ELIGIBLE; changes nothing)
        if: inputs.mode == 'b25phys_postdelete_verify'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b25phys-postdelete-verify' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      # ── preflight (read-only) ───────────────────────────────────────────────
      - name: Preflight (read-only; stops on any difference from the inspection baseline)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='preflight' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh) | tee "$RUNNER_TEMP/preflight.log"
          MD5="$(grep -oE '^gcs_inventory_md5=[0-9a-f]{32}' "$RUNNER_TEMP/preflight.log" | head -1 | cut -d= -f2)"
          [[ "$MD5" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::preflight did not report the GCS inventory digest"; exit 1; }
          echo "GCS_INVENTORY_MD5=$MD5" >> "$GITHUB_ENV"
        if: inputs.mode == 'preflight' || inputs.mode == 'schema_apply'

      # ── schema_apply (mutation) ────────────────────────────────────────────
      - name: Schema apply (backup → migrate image → api stopped under EXIT trap → allow-listed push → verify → old api restarted)
        if: inputs.mode == 'schema_apply'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='schema-apply' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh) | tee "$RUNNER_TEMP/schema-apply.log"
          grep -q '^second push: No changes detected' "$RUNNER_TEMP/schema-apply.log" || { echo "::error::second push did not report No changes detected"; exit 1; }
          grep -qE "^schema_fingerprint=$FP_AFTER" "$RUNNER_TEMP/schema-apply.log" || { echo "::error::after-fingerprint not reported as $FP_AFTER"; exit 1; }

      - name: Recover (always after schema_apply — api running and healthy, temporary artefacts removed)
        if: always() && inputs.mode == 'schema_apply'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='recover' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      # ── postdeploy_verify (after deploy-dev-vps deployed eb2edb0) ──────────
      - name: Post-deployment verification (read-only; storage_objects must be empty before any smoke)
        if: inputs.mode == 'postdeploy_verify'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='postdeploy-verify' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh) | tee "$RUNNER_TEMP/postdeploy.log"
          MD5="$(grep -oE '^gcs_inventory_md5=[0-9a-f]{32}' "$RUNNER_TEMP/postdeploy.log" | head -1 | cut -d= -f2)"
          [[ "$MD5" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::no GCS inventory digest"; exit 1; }
          echo "GCS_INVENTORY_MD5=$MD5" >> "$GITHUB_ENV"

      - name: Disposable smoke — setup (one disposable platform owner; credentials generated here and masked)
        if: inputs.mode == 'postdeploy_verify'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          umask 077
          TAG="$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          PW="S1-$(head -c 24 /dev/urandom | base64 | tr -d '/+=\n' | head -c 32)"
          echo "::add-mask::$PW"
          HASH="$(cd artifacts/api-server && PW="$PW" node -e 'const b=require("bcryptjs");process.stdout.write(b.hashSync(process.env.PW,10))')"
          [[ "$HASH" =~ ^\$2[aby]\$10\$.{53}$ ]] || { echo "::error::bcrypt hash has an unexpected shape"; exit 1; }
          echo "::add-mask::$HASH"
          EMAIL="b25-smoke-$TAG-owner@b25smoke.invalid"
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='smoke-setup' ARG1='$HASH' ARG2='$EMAIL' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh) | tee "$RUNNER_TEMP/smoke-setup.log"
          UID_="$(grep -oE '^disposable_owner_user_id=[0-9]+' "$RUNNER_TEMP/smoke-setup.log" | cut -d= -f2)"
          [[ "$UID_" =~ ^[0-9]+$ ]] || { echo "::error::no disposable owner id"; exit 1; }
          printf '%s' "$PW" > "$RUNNER_TEMP/.po-pw"
          { echo "SMOKE_TAG=$TAG"; echo "PO_EMAIL=$EMAIL"; echo "PO_USER_ID=$UID_"; echo "SMOKE_OUT=$RUNNER_TEMP/smoke-state.json"; } >> "$GITHUB_ENV"

      - name: Disposable smoke — run (first-party upload / download contract, branding logo, metrics)
        if: inputs.mode == 'postdeploy_verify'
        run: |
          set -euo pipefail
          PO_PASSWORD="$(cat "$RUNNER_TEMP/.po-pw")" STEP=run node .github/scripts/b25-stage1-smoke.mjs

      - name: Disposable smoke — VPS-side verification (inventory rows, ownership marker, generation strings, token-specific leak gate over the protected stdin channel)
        if: inputs.mode == 'postdeploy_verify'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          C="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(s.companies.join(","))')"
          U="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write([...s.users, process.env.PO_USER_ID].join(","))')"
          # Token-specific leak detector recorded by the smoke (the capability's signature component, 43 base64url
          # characters, unique to this run's capability). It is masked BEFORE any further command, travels to the
          # host ONLY as the first line of the stdin stream (`B25_LEAK_DETECTOR=…`, a shell variable of the streamed
          # script — never an SSH command argument, never a URL, never an artifact, never SQL text) and is unset
          # here afterwards; the state file that holds it is removed by the always-steps.
          D="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.leakDetector || ""))')"
          [[ "$D" =~ ^[A-Za-z0-9_-]{43}$ ]] || { echo "::error::smoke state carries no well-formed leak detector"; exit 1; }
          echo "::add-mask::$D"
          [[ "$C" =~ ^[0-9]+(,[0-9]+)*$ ]] && [[ "$U" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::smoke state malformed"; exit 1; }
          { printf 'B25_LEAK_DETECTOR=%s\n' "$D"; cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh; } | ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='smoke-verify' ARG1='$C' ARG2='$U' bash -s" | tee "$RUNNER_TEMP/smoke-verify.log"
          unset D
          R="$(grep -oE '^smoke_row_ids=[0-9a-f-]{36}(,[0-9a-f-]{36})*' "$RUNNER_TEMP/smoke-verify.log" | head -1 | cut -d= -f2)"
          [[ "$R" =~ ^[0-9a-f-]{36}(,[0-9a-f-]{36})*$ ]] || { echo "::error::smoke-verify did not record the smoke row uuids"; exit 1; }
          echo "SMOKE_ROW_IDS=$R" >> "$GITHUB_ENV"

      - name: Recreate the api container (readiness returns; volume identity stable)
        if: inputs.mode == 'postdeploy_verify'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='recreate-api' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      - name: Disposable smoke — re-read after recreation, then delete the disposable tenants through the product API
        if: inputs.mode == 'postdeploy_verify'
        run: |
          set -euo pipefail
          PO_PASSWORD="$(cat "$RUNNER_TEMP/.po-pw")" STEP=recheck node .github/scripts/b25-stage1-smoke.mjs

      - name: Settle (purge job → disposable objects removed by marker + exact generation → census back to baseline)
        if: inputs.mode == 'postdeploy_verify'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          C="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(s.companies.join(","))')"
          [[ "$C" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::smoke state malformed"; exit 1; }
          [[ "${SMOKE_ROW_IDS:-}" =~ ^[0-9a-f-]{36}(,[0-9a-f-]{36})*$ ]] || { echo "::error::no recorded smoke row uuids"; exit 1; }
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='smoke-settle' ARG1='$C' ARG2='$GCS_INVENTORY_MD5' ARG3='$SMOKE_ROW_IDS' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      - name: Disposable smoke — metrics back to the pre-smoke baseline
        if: inputs.mode == 'postdeploy_verify'
        run: |
          set -euo pipefail
          PO_PASSWORD="$(cat "$RUNNER_TEMP/.po-pw")" STEP=postcheck node .github/scripts/b25-stage1-smoke.mjs

      - name: Cleanup (always after postdeploy_verify — tenants removed through the API if still present; guarded row removal; zero storage residue verified)
        if: always() && inputs.mode == 'postdeploy_verify'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/.po-pw" ] && [ -f "${SMOKE_OUT:-/nonexistent}" ]; then
            PO_PASSWORD="$(cat "$RUNNER_TEMP/.po-pw")" STEP=teardown node .github/scripts/b25-stage1-smoke.mjs || true
            C="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(s.companies.length? s.companies.join(","):"none")')"
            U="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write([...s.users, process.env.PO_USER_ID].join(","))')"
          else
            C="none"; U="${PO_USER_ID:-}"
          fi
          if [ -z "$U" ]; then echo "nothing was created; no cleanup needed"; exit 0; fi
          [[ "$C" =~ ^([0-9]+(,[0-9]+)*|none)$ ]] && [[ "$U" =~ ^[0-9]+(,[0-9]+)*$ ]] && [[ "${SMOKE_TAG:-}" =~ ^[a-z0-9]{6,12}$ ]] || { echo "::error::cleanup arguments malformed"; exit 1; }
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='cleanup' ARG1='$C' ARG2='$U' ARG3='$SMOKE_TAG' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)
          rm -f "$RUNNER_TEMP/.po-pw" "$RUNNER_TEMP/smoke-state.json"

      # ══ B25 STAGE 2A ═══════════════════════════════════════════════════════════════════════════════════════
      # Every step streams the three scripts over SSH stdin; no ARG carries a configuration value, a path or a key.
      - name: Stage 2A — READ-ONLY pre-switch gate (30 prerequisites; decides B25_STAGE2A_PRECHECK_ELIGIBLE; no write test; changes nothing)
        if: inputs.mode == 'stage2a_precheck'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='stage2a-precheck' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      - name: Stage 2A — READ-ONLY post-switch verification (22 prerequisites; decides B25_STAGE2A_POSTSWITCH_READY; changes nothing)
        if: inputs.mode == 'stage2a_postswitch_verify'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='stage2a-postswitch-verify' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      - name: Stage 2A — ACTIVATE (MUTATION; precheck → staged key counted → five locked variables rendered → api recreated → post-switch verify; rollback on any failure)
        if: inputs.mode == 'stage2a_activate'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='stage2a-activate' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh) | tee "$RUNNER_TEMP/stage2a-activate.log"
          grep -qx 'B25_STAGE2A_ACTIVATED=TRUE' "$RUNNER_TEMP/stage2a-activate.log" || { echo "::error::activation did not report B25_STAGE2A_ACTIVATED=TRUE"; exit 1; }

      - name: Stage 2A — ROLLBACK (MUTATION; DRIVER=gcs explicit; fallback off; mirror off; root and key lines preserved; api recreated; nothing deleted)
        if: inputs.mode == 'stage2a_rollback'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='stage2a-rollback' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh) | tee "$RUNNER_TEMP/stage2a-rollback.log"
          grep -qx 'B25_STAGE2A_ROLLBACK_OK=TRUE' "$RUNNER_TEMP/stage2a-rollback.log" || { echo "::error::rollback did not report B25_STAGE2A_ROLLBACK_OK=TRUE"; exit 1; }

      - name: Stage 2A — state (always after activate / rollback; READ-ONLY report; never fails the job by itself)
        if: always() && (inputs.mode == 'stage2a_activate' || inputs.mode == 'stage2a_rollback')
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='stage2a-state' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh)

      # ── stage2a_smoke (MUTATION; disposable; fs primary + strict mirror) ─────────────────────────────────
      - name: Stage 2A smoke — setup (switched state proven; one disposable platform owner; credentials generated here and masked)
        if: inputs.mode == 'stage2a_smoke'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          umask 077
          TAG="$(head -c 6 /dev/urandom | od -An -tx1 | tr -d ' \n')"
          PW="S2-$(head -c 24 /dev/urandom | base64 | tr -d '/+=\n' | head -c 32)"
          echo "::add-mask::$PW"
          HASH="$(cd artifacts/api-server && PW="$PW" node -e 'const b=require("bcryptjs");process.stdout.write(b.hashSync(process.env.PW,10))')"
          [[ "$HASH" =~ ^\$2[aby]\$10\$.{53}$ ]] || { echo "::error::bcrypt hash has an unexpected shape"; exit 1; }
          echo "::add-mask::$HASH"
          EMAIL="b25-smoke-$TAG-owner@b25smoke.invalid"
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='stage2a-smoke-setup' ARG1='$HASH' ARG2='$EMAIL' bash -s" < <(cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh) | tee "$RUNNER_TEMP/smoke-setup.log"
          UID_="$(grep -oE '^disposable_owner_user_id=[0-9]+' "$RUNNER_TEMP/smoke-setup.log" | cut -d= -f2)"
          [[ "$UID_" =~ ^[0-9]+$ ]] || { echo "::error::no disposable owner id"; exit 1; }
          # Correction 3: the pre-smoke snapshot of the existing tenant (counts, booleans and digests only, one base64
          # line printed by the host BEFORE the disposable owner existed) is kept on the runner and returned to the
          # cleanup session as the first line of its stdin stream — never as an SSH argument.
          grep -qx 'B25_STAGE2A_TENANT_START_GATE=PASS' "$RUNNER_TEMP/smoke-setup.log" || { echo "::error::the host did not report B25_STAGE2A_TENANT_START_GATE=PASS"; exit 1; }
          SNAP="$(grep -oE '^B25_TENANT_SNAPSHOT=[A-Za-z0-9+/=]+' "$RUNNER_TEMP/smoke-setup.log" | cut -d= -f2-)"
          # (never the bounded repetition {40,20000}: glibc compiles it into a huge automaton — seconds and hundreds of MB per evaluation)
          [[ "$SNAP" =~ ^[A-Za-z0-9+/=]+$ ]] && [ "${#SNAP}" -ge 40 ] && [ "${#SNAP}" -le 20000 ] || { echo "::error::no pre-smoke tenant snapshot"; exit 1; }
          printf '%s' "$SNAP" > "$RUNNER_TEMP/stage2a-tenant-snapshot.b64"
          # Correction 5: the pre-smoke record of the PROTECTED live inventory (counts and digests only, one base64 line
          # printed by the host right after the tenant snapshot) is kept on the runner and returned as the first stdin line
          # of the verification, recreate, settle and cleanup sessions — never as an SSH argument, never a workflow input.
          grep -qx 'B25_STAGE2A_PROTECTED_GATE=PASS' "$RUNNER_TEMP/smoke-setup.log" || { echo "::error::the host did not report B25_STAGE2A_PROTECTED_GATE=PASS"; exit 1; }
          PSET="$(grep -oE '^B25_PROTECTED_SET=[A-Za-z0-9+/=]+' "$RUNNER_TEMP/smoke-setup.log" | tail -1 | cut -d= -f2-)"
          [[ "$PSET" =~ ^[A-Za-z0-9+/=]+$ ]] && [ "${#PSET}" -ge 40 ] && [ "${#PSET}" -le 20000 ] || { echo "::error::no pre-smoke protected-set record"; exit 1; }
          printf '%s' "$PSET" > "$RUNNER_TEMP/stage2a-protected-set.b64"
          printf '%s' "$PW" > "$RUNNER_TEMP/.po-pw"
          { echo "SMOKE_TAG=$TAG"; echo "PO_EMAIL=$EMAIL"; echo "PO_USER_ID=$UID_"; echo "SMOKE_OUT=$RUNNER_TEMP/smoke-state.json"; echo "SMOKE_STAGE=2a"; echo "S2A_TENANT_SNAPSHOT_FILE=$RUNNER_TEMP/stage2a-tenant-snapshot.b64"; echo "S2A_PROTECTED_SET_FILE=$RUNNER_TEMP/stage2a-protected-set.b64"; } >> "$GITHUB_ENV"

      - name: Stage 2A smoke — run (first-party upload / download contract with the deterministic fixture, branding logo kept, metrics fs / fallback / mirror)
        if: inputs.mode == 'stage2a_smoke'
        run: |
          set -euo pipefail
          PO_PASSWORD="$(cat "$RUNNER_TEMP/.po-pw")" STEP=run node .github/scripts/b25-stage1-smoke.mjs

      - name: Stage 2A smoke — VPS-side verification (fs rows, encrypted files, mirror objects with marker + generation + digest, leak gates, census)
        if: inputs.mode == 'stage2a_smoke'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          C="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(s.companies.join(","))')"
          U="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write([...s.users, process.env.PO_USER_ID].join(","))')"
          D="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.leakDetector || ""))')"
          [[ "$D" =~ ^[A-Za-z0-9_-]{43}$ ]] || { echo "::error::smoke state carries no well-formed leak detector"; exit 1; }
          echo "::add-mask::$D"
          FS="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.fileSha || ""))')"
          FZ="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.fileSize || ""))')"
          FM="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.fixtureMarker || ""))')"
          LS="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.logoSha || ""))')"
          LZ="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.logoSize || ""))')"
          [[ "$C" =~ ^[0-9]+(,[0-9]+)*$ ]] && [[ "$U" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::smoke state malformed"; exit 1; }
          [[ "$FS" =~ ^[0-9a-f]{64}$ ]] && [[ "$FZ" =~ ^[1-9][0-9]*$ ]] && [[ "$FM" =~ ^B25-STAGE2A-PLAINTEXT-MARKER-[a-z0-9]{6,12}$ ]] && [[ "$LS" =~ ^[0-9a-f]{64}$ ]] && [[ "$LZ" =~ ^[1-9][0-9]*$ ]] || { echo "::error::smoke state carries no well-formed fixture facts"; exit 1; }
          PSET="$(cat "${S2A_PROTECTED_SET_FILE:-/nonexistent}" 2>/dev/null || true)"
          [[ "$PSET" =~ ^[A-Za-z0-9+/=]+$ ]] && [ "${#PSET}" -ge 40 ] && [ "${#PSET}" -le 20000 ] || { echo "::error::pre-smoke protected-set record missing on the runner"; exit 1; }
          { printf 'B25_PROTECTED_SET=%s\nB25_LEAK_DETECTOR=%s\nB25_FIXTURE_SHA256=%s\nB25_FIXTURE_SIZE=%s\nB25_FIXTURE_MARKER=%s\nB25_LOGO_SHA256=%s\nB25_LOGO_SIZE=%s\n' "$PSET" "$D" "$FS" "$FZ" "$FM" "$LS" "$LZ"; cat .github/scripts/b25-stage1-purge-lib.sh .github/scripts/b25-stage1-apply-lib.sh .github/scripts/b25-stage1-apply.sh; } | ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='stage2a-smoke-verify' ARG1='$C' ARG2='$U' bash -s" | tee "$RUNNER_TEMP/smoke-verify.log"
          unset D
          R="$(grep -oE '^smoke_row_ids=[0-9a-f-]{36}(,[0-9a-f-]{36})*' "$RUNNER_TEMP/smoke-verify.log" | head -1 | cut -d= -f2)"
          [[ "$R" =~ ^[0-9a-f-]{36}(,[0-9a-f-]{36})*$ ]] || { echo "::error::stage2a-smoke-verify did not record the smoke row uuids"; exit 1; }
          echo "SMOKE_ROW_IDS=$R" >> "$GITHUB_ENV"

      - name: Stage 2A smoke — recreate the api container (readiness returns; volume identity and the encrypted smoke files survive)
        if: inputs.mode == 'stage2a_smoke'
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          # Correction 4: the recreate phase runs in the MIDDLE of the smoke. The switched guard takes its mid-smoke form —
          # the exception row + exactly the two rows recorded by THIS run's verification step — and those uuids, with the
          # run's fixture / logo facts, travel as the first lines of the stdin stream (shell variables of the streamed
          # script): never an SSH argument, never a workflow input, never chosen by an operator.
          [[ "${SMOKE_ROW_IDS:-}" =~ ^[0-9a-f-]{36},[0-9a-f-]{36}$ ]] || { echo "::error::stage2a-smoke-verify did not record exactly two smoke row uuids"; exit 1; }
          FS="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.fileSha || ""))')"
          FZ="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.fileSize || ""))')"
          FM="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.fixtureMarker || ""))')"
          LS="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.logoSha || ""))')"
          LZ="$(node -e 'const s=require(process.env.SMOKE_OUT);process.stdout.write(String(s.logoSize || ""))')"
          [[ "$FS" =~ ^[0-9a-f]{64}$ ]] && [[ "$FZ" =~ ^[1-9][0-9]*$ ]] && [[ "$FM" =~ ^B25-STAGE2A-PLAINTEXT-MARKER-[a-z0-9]{6,12}$ ]] && [[ "$LS" =~ ^[0-9a-f]{64}$ ]] && [[ "$LZ" =~ ^[1-9][0-9]*$ ]] || { echo "::error::smoke state carries no well-formed fixture facts"; exit 1; }
          PSET="$(cat "${S2A_PROTECTED_SET_FILE:-/nonexistent}" 2>/dev/null || true)"
          [[ "$PSET" =~ ^[A-Za-z0-9+/=]+$ ]] && [ "${#PSET}" -ge 40 ] && [ "${#PSET}" -le 20000 ] || { echo "::error::pre-smoke protected-set record missing on the runner"; exit 1; }
