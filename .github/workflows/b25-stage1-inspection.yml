due of run 39880703889 under the protected model; decides B25_STAGE2A_RESIDUE4_ELIGIBLE / B25_STAGE2A_RESIDUE4_ALREADY_ABSENT; changes nothing) | stage2a_residue_settle_2c4bfb197fd4 (MUTATION: removes ONLY the two recorded company-60 tombstones after their file and mirror are proven absent; skips an already-absent residue; requires confirm_stage2a_residue4)"
