# =============================================================================
# TEMPORARY — B25 Stage 1 hosted READ-ONLY preflight of the dev VPS and
# schema-push rehearsal on the runner. One-off operations workflow; NOT the
# deployment pipeline (deploy-dev-vps.yml is untouched and cannot be triggered
# from this branch: it runs only on push to `develop` or a manual dispatch of
# itself) and NOT application code.
# =============================================================================
# Trigger:  push to `ops/b25-stage1-inspection` or workflow_dispatch on it ONLY.
# Guard:    the job refuses any other ref, and refuses to run unless the branch
#           content equals the accepted B25 commit (eb2edb0) plus these three
#           ops files.
# What it does (nothing on the VPS is mutated, nothing is written to the VPS):
#   1. streams a READ-ONLY inspection script over SSH stdin (`bash -s`; never
#      stored on the VPS) and records: deploy state (stop on drift from
#      5a072fd), containers / volumes / health, database counts + schema
#      fingerprint + tenant baseline, env-file metadata (no values), storage
#      driver + database inventory + Google Cloud census and reconciliation
#      (read-only LIST / metadata, counts only), host filesystem readiness,
#      backup position, log health;
#   2. streams a SCHEMA-ONLY pg_dump of the hosted database to the runner's temp
#      dir (never printed, never uploaded as an artifact, deleted at the end),
#      restores it into the job's throw-away PostgreSQL 16 service container,
#      proves the hosted fingerprint, runs `drizzle-kit push --verbose` from the
#      accepted code against that scratch database, prints and classifies every
#      statement, checks the delta against the accepted B25 design and requires
#      the second push to report "No changes detected".
# Secrets used (same as deploy-dev-vps.yml, nothing new):
#   VPS_HOST, VPS_PORT, VPS_USER, VPS_DEPLOY_PATH, VPS_SSH_KEY, VPS_KNOWN_HOSTS
# Remove this workflow (and the branch) once the inspection is recorded.

name: b25-stage1-inspection

on:
  push:
    branches: [ops/b25-stage1-inspection]
  workflow_dispatch:

# Serialize with the deployment workflow so the inspection never overlaps a deploy.
concurrency:
  group: deploy-dev-vps
  cancel-in-progress: false

env:
  # Accepted B25 commit (Correction 8); the ops branch is this commit + the ops files.
  BASE_SHA: eb2edb0ad84d859b66efbc24ea9b895f76c2ed02
  # Application commit expected on the VPS before Stage 1 (B24 Release-Gate Closure).
  EXPECTED_HOSTED_SHA: 5a072fdc50e3448bd548574698f81076191cd9bc
  # Schema fingerprint of the local development database at BASE_SHA (cross-check).
  EXPECTED_LOCAL_FP: 30c4ecbd867cd2cd59abcb58581ecb04
  SCRATCH_URL: postgresql://scratch:scratch-only@localhost:5432/scratch

jobs:
  inspect:
    name: B25 Stage 1 hosted read-only preflight + schema-push rehearsal (one-off)
    if: github.ref == 'refs/heads/ops/b25-stage1-inspection'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scratch
          POSTGRES_PASSWORD: scratch-only
          POSTGRES_DB: scratch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scratch -d scratch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the branch is the accepted B25 commit (eb2edb0) + the three ops files only
        run: |
          git cat-file -e "$BASE_SHA^{commit}" || { echo "base commit not present"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo "branch does not descend from the base commit"; exit 1; }
          DIFF="$(git diff --stat "$BASE_SHA" HEAD -- . ':(exclude).github/scripts/b25-stage1-inspect.sh' ':(exclude).github/scripts/b25-stage1-schema-push.sh' ':(exclude).github/workflows/b25-stage1-inspection.yml')"
          [ -z "$DIFF" ] || { echo "branch differs from the base commit outside the ops files:"; echo "$DIFF"; exit 1; }
          bash -n .github/scripts/b25-stage1-inspect.sh && bash -n .github/scripts/b25-stage1-schema-push.sh
          grep -q 'default_transaction_read_only = on' .github/scripts/b25-stage1-inspect.sh || { echo "script is missing the read-only session guard"; exit 1; }
          echo "branch = $BASE_SHA + ops files only; scripts parse; read-only guard present"

      - name: Accepted deployment design (from this checkout; non-secret directives only)
        run: |
          echo "== docker-compose.yml OBJECT_STORAGE pass-through and objectdata volume"
          grep -nE 'OBJECT_STORAGE_|objectdata|/data/objects' docker/docker-compose.yml
          echo "== compose.vps.yml prepared bind mount (commented) and credential mount"
          grep -nE '/data/objects|gcs-service-account|GCS_CREDENTIAL_GID' docker/compose.vps.yml
          echo "== Dockerfile.api object root"
          grep -nE '/data/objects' docker/Dockerfile.api
          echo "== nginx body limit"
          grep -nE 'client_max_body_size' docker/nginx/default.conf.template
          echo "== schema files"
          git diff --stat "$EXPECTED_HOSTED_SHA" "$BASE_SHA" -- lib/db

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - name: Install (frozen lockfile; drizzle-kit for the scratch rehearsal)
        run: pnpm install --frozen-lockfile

      - name: Install SSH key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Hosted read-only preflight (script streamed over stdin; stops on drift from the expected hosted commit)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='inspect' EXPECTED_HEAD='$EXPECTED_HOSTED_SHA' ACCEPTED_SHA='$BASE_SHA' bash -s" < .github/scripts/b25-stage1-inspect.sh | tee "$RUNNER_TEMP/inspect.log"
          FP="$(grep -oE '^schema_fingerprint=[0-9a-f]{32}' "$RUNNER_TEMP/inspect.log" | head -1 | cut -d= -f2)"
          [[ "$FP" =~ ^[0-9a-f]{32}$ ]] || { echo "::error::no hosted schema fingerprint reported"; exit 1; }
          echo "HOSTED_FP=$FP" >> "$GITHUB_ENV"

      - name: Schema-only dump of the hosted database (script streamed over stdin; dump to the runner temp dir only; never printed)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          umask 077
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='schema-dump' bash -s" < .github/scripts/b25-stage1-inspect.sh > "$RUNNER_TEMP/schema.sql"
          echo "dump bytes=$(stat -c %s "$RUNNER_TEMP/schema.sql") lines=$(wc -l < "$RUNNER_TEMP/schema.sql") sha256_prefix=$(sha256sum "$RUNNER_TEMP/schema.sql" | cut -c1-16) create_table=$(grep -c '^CREATE TABLE' "$RUNNER_TEMP/schema.sql" || true) data_rows=$(grep -cE '^(INSERT|COPY) ' "$RUNNER_TEMP/schema.sql" || true)"
          [ "$(grep -cE '^(INSERT|COPY) ' "$RUNNER_TEMP/schema.sql" || true)" = "0" ] || { echo "::error::the dump contains data statements"; exit 1; }

      - name: Schema-push rehearsal on the runner's scratch PostgreSQL 16 (hosted database untouched)
        env:
          DUMP: ${{ runner.temp }}/schema.sql
          OUT: ${{ runner.temp }}
          REPO: ${{ github.workspace }}
          EXPECTED_HOSTED_FP: ${{ env.HOSTED_FP }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          echo "psql client: $(psql --version)"
          bash .github/scripts/b25-stage1-schema-push.sh

      - name: Prove nothing was left on the VPS and remove the dump from the runner (always)
        if: always()
        run: |
          ssh vps 'ls -la "$HOME" 2>/dev/null | grep -cE "b25" || echo 0' < /dev/null | sed 's/^/b25-named files in the deploy user home on the VPS: /' || true
          rm -f "$RUNNER_TEMP/schema.sql" "$RUNNER_TEMP/schema.restore.sql" "$RUNNER_TEMP/push1.log" "$RUNNER_TEMP/push2.log" "$RUNNER_TEMP/restore.log" "$RUNNER_TEMP/inspect.log"
          echo "cleanup done"
