          [ -n "${SMOKE_START_MS:-}" ] || { echo "no smoke start recorded"; exit 0; }
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-verify' ARG1='$SMOKE_START_MS' ARG2='$TAG' ARG3='post' bash \"\$HOME/b20-act.sh\"" < /dev/null
