      - name: b22-verify POST-cleanup + object re-check (ALWAYS, read-only — zero B22 rows, objects gone)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
