            ${{ runner.temp }}/b22/state.json
          retention-days: 7
          if-no-files-found: warn

      - name: b22-verify PRE-cleanup (read-only queue / log / row evidence)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
