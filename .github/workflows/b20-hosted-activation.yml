  b22c1:
    name: B22 Correction 1 hosted smoke (one guarded scan probe, disposable tenant, API-level)
    if: github.ref == 'refs/heads/ops/b23-g6-backup-rehearsal' && github.event_name == 'workflow_dispatch' && inputs.phase == 'b22c1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLATFORM_HOST: https://elite.kaptnow.com
      TENANT_HOST: https://admin.kaptnow.com
      SMOKE_DOMAIN: b20smoke.invalid
      EXISTING_COMPANY_ID: "1"
      EXPECTED_SHA: ${{ inputs.arg1 }}
      EXPECTED_PREV_SHA: ${{ inputs.arg2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the branch is the deployed develop commit (f53c901) + the ops files only; validate inputs
        run: |
          git cat-file -e "$BASE_SHA^{commit}" || { echo "base commit not present"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo "branch does not descend from the base commit"; exit 1; }
          DIFF="$(git diff --stat "$BASE_SHA" HEAD -- . ':(exclude).github/scripts/b20-*' ':(exclude).github/workflows/b20-hosted-activation.yml')"
          [ -z "$DIFF" ] || { echo "branch differs from the base commit outside the ops files:"; echo "$DIFF"; exit 1; }
          bash -n .github/scripts/b20-act.sh && node --check .github/scripts/b20-smoke6.mjs
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "arg1 must be the deployed commit sha"; exit 1; }
          [[ "$EXPECTED_PREV_SHA" =~ ^([0-9a-f]{40}|-)$ ]] || { echo "arg2 must be the previous commit sha or '-'"; exit 1; }
          [ -f artifacts/api-server/scripts/ocr-fixtures/english-clean.jpg ] || { echo "OCR fixture missing"; exit 1; }
          echo "branch = $BASE_SHA + ops files only; scripts parse; expected deploy $EXPECTED_SHA (previous $EXPECTED_PREV_SHA)"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - name: Install (frozen lockfile; no browser needed — API-level smoke)
        run: pnpm install --frozen-lockfile

      - name: Generate disposable credentials (masked; only the owner hash leaves the runner)
        run: |
          set -euo pipefail
          umask 077
          TAG="$(openssl rand -hex 4)"
          gen() { printf 'Sm0ke!%s' "$(openssl rand -base64 33 | tr -dc 'A-Za-z0-9' | cut -c1-26)"; }
          OWNER_PW="$(gen)"; A_ADMIN_PW="$(gen)"; B_ADMIN_PW="$(gen)"; E_PW="$(gen)"
          for v in "$OWNER_PW" "$A_ADMIN_PW" "$B_ADMIN_PW" "$E_PW"; do echo "::add-mask::$v"; done
          HASH="$(OWNER_PW="$OWNER_PW" node -e 'const b=require(process.cwd()+"/artifacts/api-server/node_modules/bcryptjs"); process.stdout.write(b.hashSync(process.env.OWNER_PW, 10))')"
          echo "::add-mask::$HASH"
          printf "OWNER_PASSWORD='%s'\nA_ADMIN_PASSWORD='%s'\nB_ADMIN_PASSWORD='%s'\nA_EMPLOYEE_PASSWORD='%s'\n" "$OWNER_PW" "$A_ADMIN_PW" "$B_ADMIN_PW" "$E_PW" > "$RUNNER_TEMP/b20-creds"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "OWNER_EMAIL=b20-smoke-$TAG@$SMOKE_DOMAIN" >> "$GITHUB_ENV"
          echo "OWNER_HASH=$HASH" >> "$GITHUB_ENV"
          echo "tag=$TAG owner=b20-smoke-$TAG@$SMOKE_DOMAIN hash_prefix=$(printf '%s' "$HASH" | cut -c1-7) hash_len=${#HASH}"

      - name: Install SSH key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload the phase script to the VPS
        run: |
          ssh vps 'umask 077; cat > "$HOME/b20-act.sh" && chmod 700 "$HOME/b20-act.sh"' < .github/scripts/b20-act.sh

      - name: c4-verify BEFORE the smoke (read-only; deploy / schema / env / volume / queue / existing-customer baseline)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
