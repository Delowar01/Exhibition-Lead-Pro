        run: |
          set -euo pipefail
          [ -n "${SMOKE_START_MS:-}" ] || { echo "no smoke start recorded; nothing to clean"; exit 0; }
          STATE="$RUNNER_TEMP/b22/state.json"; EXPECTED="0"
