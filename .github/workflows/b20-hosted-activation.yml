          [ -n "$MD5" ] || { echo "c4-verify did not report the baseline"; exit 1; }
          echo "BASELINE_MD5=$MD5" >> "$GITHUB_ENV"

      - name: b22-infra BEFORE the smoke (read-only infrastructure evidence)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
