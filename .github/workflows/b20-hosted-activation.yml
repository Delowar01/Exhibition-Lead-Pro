          git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo "branch does not descend from the base commit"; exit 1; }
          DIFF="$(git diff --stat "$BASE_SHA" HEAD -- . ':(exclude).github/scripts/b20-*' ':(exclude).github/workflows/b20-hosted-activation.yml')"
          [ -z "$DIFF" ] || { echo "branch differs from the base commit outside the ops files:"; echo "$DIFF"; exit 1; }
          bash -n .github/scripts/b20-act.sh && node --check .github/scripts/b20-smoke7.mjs
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "arg1 must be the deployed commit sha"; exit 1; }
          [[ "$EXPECTED_PREV_SHA" =~ ^([0-9a-f]{40}|-)$ ]] || { echo "arg2 must be the previous commit sha or '-'"; exit 1; }
          echo "branch = $BASE_SHA + ops files only; scripts parse; expected deploy $EXPECTED_SHA (previous $EXPECTED_PREV_SHA)"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - name: Install (frozen lockfile; no browser needed — API-level smoke)
        run: pnpm install --frozen-lockfile

      - name: Archive tooling on the runner (7-Zip for AES-256 + ZipCrypto, Info-ZIP unzip for legacy compatibility; runner-only, no product dependency)
        run: |
          set -euo pipefail
          if ! command -v 7zz >/dev/null 2>&1 && ! command -v 7z >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full; fi
          command -v unzip >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq unzip; }
          echo "7-Zip: $(command -v 7zz || command -v 7z)"; { (7zz 2>/dev/null || 7z 2>/dev/null || true) | head -2; } || true
          echo "unzip: $(command -v unzip)"; unzip -v 2>/dev/null | head -1 || true

      - name: Generate disposable credentials (masked; only the owner hash leaves the runner; export passwords are generated INSIDE the smoke and never printed)
        run: |
          set -euo pipefail
          umask 077
          TAG="$(openssl rand -hex 4)"
          gen() { printf 'Sm0ke!%s' "$(openssl rand -base64 33 | tr -dc 'A-Za-z0-9' | cut -c1-26)"; }
          OWNER_PW="$(gen)"; A_ADMIN_PW="$(gen)"; B_ADMIN_PW="$(gen)"
          for v in "$OWNER_PW" "$A_ADMIN_PW" "$B_ADMIN_PW"; do echo "::add-mask::$v"; done
          HASH="$(OWNER_PW="$OWNER_PW" node -e 'const b=require(process.cwd()+"/artifacts/api-server/node_modules/bcryptjs"); process.stdout.write(b.hashSync(process.env.OWNER_PW, 10))')"
          echo "::add-mask::$HASH"
          printf "OWNER_PASSWORD='%s'\nA_ADMIN_PASSWORD='%s'\nB_ADMIN_PASSWORD='%s'\n" "$OWNER_PW" "$A_ADMIN_PW" "$B_ADMIN_PW" > "$RUNNER_TEMP/b20-creds"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "OWNER_EMAIL=b20-smoke-$TAG@$SMOKE_DOMAIN" >> "$GITHUB_ENV"
          echo "OWNER_HASH=$HASH" >> "$GITHUB_ENV"
          echo "tag=$TAG owner=b20-smoke-$TAG@$SMOKE_DOMAIN hash_prefix=$(printf '%s' "$HASH" | cut -c1-7) hash_len=${#HASH}"

      - name: Install SSH key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOC
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOC
          chmod 600 ~/.ssh/config

      - name: Upload the phase script to the VPS
        run: |
          ssh vps 'umask 077; cat > "$HOME/b20-act.sh" && chmod 700 "$HOME/b20-act.sh"' < .github/scripts/b20-act.sh

      - name: c4-verify BEFORE the smoke (read-only; deploy / schema / env / volume / queue / existing-customer baseline)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='c4-verify' ARG1='$EXPECTED_SHA' ARG2='$EXPECTED_PREV_SHA' ARG3='$TAG|none|0' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/g3-before.log"
          MD5="$(grep -oE '^baseline_md5=[0-9a-f]{32}' "$RUNNER_TEMP/g3-before.log" | head -1 | cut -d= -f2)"
          [ -n "$MD5" ] || { echo "c4-verify did not report the baseline"; exit 1; }
          echo "BASELINE_MD5=$MD5" >> "$GITHUB_ENV"

      - name: b22-infra BEFORE the smoke (read-only infrastructure evidence; readyz storage must be ok)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-infra' ARG1='$TAG' ARG2='' ARG3='' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/g3-infra.log"
          START="$(grep -oE '^now_epoch_ms=[0-9]+' "$RUNNER_TEMP/g3-infra.log" | head -1 | cut -d= -f2)"
          [ -n "$START" ] || { echo "b22-infra did not report the clock"; exit 1; }
          echo "SMOKE_START_MS=$START" >> "$GITHUB_ENV"

      - name: g3-count BEFORE the smoke (read-only object-storage baseline — counts per prefix only)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='g3-count' ARG1='' ARG2='' ARG3='' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/g3-count-before.log"
          LINE="$(grep -oE '^objects uploads=[0-9]+ scans=[0-9]+ branding=[0-9]+ total=[0-9]+ other=[0-9-]+' "$RUNNER_TEMP/g3-count-before.log" | head -1)"
          [ -n "$LINE" ] || { echo "g3-count did not report object counts"; exit 1; }
          echo "OBJ_BEFORE=$LINE" >> "$GITHUB_ENV"

      - name: smoke-setup (one disposable platform owner, no company; ids only in the log)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='smoke-setup' ARG1='$OWNER_HASH' ARG2='$OWNER_EMAIL' ARG3='$EXPECTED_SHA' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/b20-setup.log"
          UID_="$(grep -oE '^disposable_owner_user_id=[0-9]+' "$RUNNER_TEMP/b20-setup.log" | head -1 | cut -d= -f2)"
          [ -n "$UID_" ] || { echo "no disposable owner id returned"; exit 1; }
          echo "OWNER_USER_ID=$UID_" >> "$GITHUB_ENV"

      - name: Run the G-3 smoke (API-level; two password-protected contact CSV exports — aes256 and zip20 — against real object storage)
        env:
          OUT_DIR: ${{ runner.temp }}/g3
          STATE_FILE: ${{ runner.temp }}/g3/state.json
          WORK_DIR: ${{ runner.temp }}/g3work
        run: |
          set -euo pipefail
          set -a; . "$RUNNER_TEMP/b20-creds"; set +a
          mkdir -p "$OUT_DIR" "$WORK_DIR"
          node .github/scripts/b20-smoke7.mjs

      - name: Scrub the evidence files (no signed URL, signature, bucket host or token may be present; passwords are checked by the smoke itself)
        if: always()
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP/g3/summary.json" "$RUNNER_TEMP/g3/state.json"; do
            [ -f "$f" ] || continue
            if grep -qE 'X-Goog|storage\.googleapis\.com|"token"|Bearer ' "$f"; then echo "forbidden material in $(basename "$f") — withheld from the artifact"; rm -f "$f"; fi
          done
          ls -la "$RUNNER_TEMP/g3" || true

      - name: Upload evidence (summary + state; no secrets, no URLs, no decrypted content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b23-g3-hosted-export-evidence
          path: |
            ${{ runner.temp }}/g3/summary.json
            ${{ runner.temp }}/g3/state.json
          retention-days: 7
          if-no-files-found: warn

      - name: g3-verify PRE-cleanup (read-only — export_runs rows, schema, audit keys, queue, log counters)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [ -n "${SMOKE_START_MS:-}" ] || { echo "no smoke start recorded"; exit 0; }
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='g3-verify' ARG1='$SMOKE_START_MS' ARG2='$TAG' ARG3='pre' bash \"\$HOME/b20-act.sh\"" < /dev/null

      - name: b22-objects CHECK (read-only; the two export objects through the app's own credential) + md5 comparison with the downloaded bytes
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/g3/state.json"; LABELS="none"
          [ -f "$STATE" ] && LABELS="$(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(s.objects.length? s.objects.join(","):"none")' "$STATE")"
          echo "object labels: $(echo "$LABELS" | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<uuid>/g')"
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-objects' ARG1='check' ARG2='$LABELS' ARG3='$TAG' bash \"\$HOME/b20-act.sh\"" < /dev/null | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<uuid>/g' | tee "$RUNNER_TEMP/g3-objects-check.log"
          if [ "$LABELS" != "none" ]; then
            ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-objects' ARG1='check' ARG2='$LABELS' ARG3='$TAG' bash \"\$HOME/b20-act.sh\"" < /dev/null > "$RUNNER_TEMP/g3-objects-check-raw.log"
            node -e '
              const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const out=fs.readFileSync(process.argv[2],"utf8");
              let bad=0;
              for (const [label, d] of Object.entries(s.downloads||{})) {
                const m=out.match(new RegExp("^"+label.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\\\$&")+" exists=(true|false)(?: size=(\\d+) contentType=(\\S+) md5=([0-9a-f]+))?","m"));
                const ok=!!m && m[1]==="true" && Number(m[2])===d.bytes && m[4]===d.md5;
                console.log(`${d.method}: object exists=${m?m[1]:"?"} storedSize=${m?m[2]:"?"} downloadedBytes=${d.bytes} storedMd5Matches=${!!m && m[4]===d.md5} contentType=${m?m[3]:"?"} -> ${ok?"MATCH":"MISMATCH"}`);
                if(!ok) bad++;
              }
              if (Object.keys(s.downloads||{}).length===0) { console.log("no downloads recorded"); bad++; }
              process.exit(bad?1:0);' "$STATE" "$RUNNER_TEMP/g3-objects-check-raw.log"
            rm -f "$RUNNER_TEMP/g3-objects-check-raw.log"
          fi

      - name: b22-objects DELETE (ALWAYS — exactly the recorded export objects, guarded by the disposable tenants' export_runs rows)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/g3/state.json"; LABELS="none"
          [ -f "$STATE" ] && LABELS="$(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(s.objects.length? s.objects.join(","):"none")' "$STATE")"
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-objects' ARG1='delete' ARG2='$LABELS' ARG3='$TAG' bash \"\$HOME/b20-act.sh\"" < /dev/null | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<uuid>/g'

      - name: b22-cleanup (ALWAYS — the smoke's queue rows, exact-count guard; no e-mail job is expected)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [ -n "${SMOKE_START_MS:-}" ] || { echo "no smoke start recorded; nothing to clean"; exit 0; }
          STATE="$RUNNER_TEMP/g3/state.json"; EXPECTED="0"
          [ -f "$STATE" ] && EXPECTED="$(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(String(s.expectedEmailJobs||0))' "$STATE")"
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-cleanup' ARG1='$SMOKE_START_MS' ARG2='$TAG' ARG3='$EXPECTED' bash \"\$HOME/b20-act.sh\"" < /dev/null

      - name: cleanup (ALWAYS — exactly the recorded disposable companies / users; export_runs and contacts go with their company)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/g3/state.json"
          if [ -z "${OWNER_USER_ID:-}" ]; then echo "smoke-setup did not create an owner row; nothing to clean"; exit 0; fi
          C_IDS="none"; U_IDS="$OWNER_USER_ID"
          if [ -f "$STATE" ]; then
            C_IDS="$(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(s.companyIds.length? s.companyIds.join(","):"none")' "$STATE")"
            U_IDS="$(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(s.userIds.join(","))' "$STATE")"
          fi
          echo "cleanup targets: companies=[$C_IDS] users=[$U_IDS] tag=$TAG"
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='cleanup' ARG1='$C_IDS' ARG2='$U_IDS' ARG3='$SMOKE_DOMAIN:$TAG' bash \"\$HOME/b20-act.sh\"" < /dev/null

      - name: c4-verify AFTER cleanup (ALWAYS, read-only — zero disposable rows, baseline equality, deploy/schema/env unchanged, queue and worker health)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='c4-verify' ARG1='$EXPECTED_SHA' ARG2='$EXPECTED_PREV_SHA' ARG3='$TAG|${BASELINE_MD5:-none}|${SMOKE_START_MS:-0}' bash \"\$HOME/b20-act.sh\"" < /dev/null

      - name: g3-verify POST + b22-verify POST + object re-check + g3-count AFTER (ALWAYS, read-only — zero disposable rows, objects gone, object counts back to the baseline)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [ -n "${SMOKE_START_MS:-}" ] || { echo "no smoke start recorded"; exit 0; }
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='g3-verify' ARG1='$SMOKE_START_MS' ARG2='$TAG' ARG3='post' bash \"\$HOME/b20-act.sh\"" < /dev/null
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-verify' ARG1='$SMOKE_START_MS' ARG2='$TAG' ARG3='post' bash \"\$HOME/b20-act.sh\"" < /dev/null
          STATE="$RUNNER_TEMP/g3/state.json"; LABELS="none"
          [ -f "$STATE" ] && LABELS="$(node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(s.objects.length? s.objects.join(","):"none")' "$STATE")"
          OUT="$(ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-objects' ARG1='check' ARG2='$LABELS' ARG3='$TAG' bash \"\$HOME/b20-act.sh\"" < /dev/null)"; echo "$OUT" | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<uuid>/g'
          if [ "$LABELS" != "none" ]; then echo "$OUT" | grep -q 'exists=true' && { echo "an object of the smoke still exists"; exit 1; } || echo "all recorded objects are absent"; fi
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='g3-count' ARG1='' ARG2='' ARG3='' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/g3-count-after.log"
          AFTER="$(grep -oE '^objects uploads=[0-9]+ scans=[0-9]+ branding=[0-9]+ total=[0-9]+ other=[0-9-]+' "$RUNNER_TEMP/g3-count-after.log" | head -1)"
          echo "object counts before: ${OBJ_BEFORE:-unknown}"; echo "object counts after:  $AFTER"
          [ -n "${OBJ_BEFORE:-}" ] && [ "$AFTER" = "$OBJ_BEFORE" ] && echo "object-storage baseline restored" || { echo "object counts differ from the pre-smoke baseline"; exit 1; }

      - name: Remove the script, credentials and work directory (always)
        if: always()
        run: |
          ssh vps 'rm -f "$HOME/b20-act.sh"' < /dev/null || true
          rm -rf "$RUNNER_TEMP/b20-creds" "$RUNNER_TEMP/g3work"

  # ── B23 G-6: backup inventory + ISOLATED restore rehearsal ─────────────────
  # Phase 1 is strictly read-only. Phase 2 restores ONE verified local backup into
  # a disposable postgres container on the VPS (same image id as the live
  # container, --network none, private named volume, memory/cpu capped, backup
  # bind-mounted read-only) and removes it by trap. Nothing is uploaded to the
  # runner or to an artifact: the job log carries counts, checksums and timings.
  g6:
    name: B23 G-6 backup inventory + isolated restore rehearsal (read-only inventory; one disposable network-less postgres container; live stack untouched)
    if: github.ref == 'refs/heads/ops/b23-g6-backup-rehearsal' && github.event_name == 'workflow_dispatch' && inputs.phase == 'g6'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPECTED_SHA: ${{ inputs.arg1 }}
      EXPECTED_PREV_SHA: ${{ inputs.arg2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the branch is the deployed develop commit (f53c901) + the ops files only; validate inputs
        run: |
          git cat-file -e "$BASE_SHA^{commit}" || { echo "base commit not present"; exit 1; }
          git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo "branch does not descend from the base commit"; exit 1; }
          DIFF="$(git diff --stat "$BASE_SHA" HEAD -- . ':(exclude).github/scripts/b20-*' ':(exclude).github/workflows/b20-hosted-activation.yml')"
          [ -z "$DIFF" ] || { echo "branch differs from the base commit outside the ops files:"; echo "$DIFF"; exit 1; }
          bash -n .github/scripts/b20-act.sh
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "arg1 must be the deployed commit sha"; exit 1; }
          [[ "$EXPECTED_PREV_SHA" =~ ^([0-9a-f]{40}|-)$ ]] || { echo "arg2 must be the previous commit sha or '-'"; exit 1; }
          TAG="$(openssl rand -hex 4)"; echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "branch = $BASE_SHA + ops files only; script parses; expected deploy $EXPECTED_SHA (previous $EXPECTED_PREV_SHA); tag=$TAG; utc=$(date -u +%FT%TZ)"

      - name: Install SSH key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOC
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            Port ${{ secrets.VPS_PORT }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOC
          chmod 600 ~/.ssh/config

      - name: Upload the phase script to the VPS
        run: |
          ssh vps 'umask 077; cat > "$HOME/b20-act.sh" && chmod 700 "$HOME/b20-act.sh"' < .github/scripts/b20-act.sh

      - name: c4-verify BEFORE (read-only — deploy / schema / env / volume / queue / existing-customer baseline; stops on drift)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='c4-verify' ARG1='$EXPECTED_SHA' ARG2='$EXPECTED_PREV_SHA' ARG3='$TAG|none|0' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/g6-before.log"
          MD5="$(grep -oE '^baseline_md5=[0-9a-f]{32}' "$RUNNER_TEMP/g6-before.log" | head -1 | cut -d= -f2)"
          [ -n "$MD5" ] || { echo "c4-verify did not report the baseline"; exit 1; }
          echo "BASELINE_MD5=$MD5" >> "$GITHUB_ENV"
          START="$(grep -oE '^now_epoch_ms=[0-9]+' "$RUNNER_TEMP/g6-before.log" | head -1 | cut -d= -f2)"
          echo "SMOKE_START_MS=${START:-0}" >> "$GITHUB_ENV"

      - name: Phase 1 — g6-inventory (STRICTLY read-only; backups, schedule, off-host evidence, capacity gate)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='g6-inventory' ARG1='' ARG2='' ARG3='$TAG' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/g6-inventory.log"
          grep -E '^backup leadcapture-' "$RUNNER_TEMP/g6-inventory.log" | sed -E 's/ age_h=[0-9]+//' | sort > "$RUNNER_TEMP/backups-before.txt"
          grep -E '^(all containers|all volumes|images|postgres mounts|env):' "$RUNNER_TEMP/g6-inventory.log" | sort > "$RUNNER_TEMP/stack-before.txt"
          SEL="$(grep -oE 'selected_backup=[^ ]+' "$RUNNER_TEMP/g6-inventory.log" | head -1 | cut -d= -f2)"
          SUM="$(grep -oE 'selected_sha256=[0-9a-f]{64}' "$RUNNER_TEMP/g6-inventory.log" | head -1 | cut -d= -f2 || true)"
          GATE="$(grep -oE '^gate=.*' "$RUNNER_TEMP/g6-inventory.log" | head -1)"
          echo "SELECTED_BACKUP=$SEL" >> "$GITHUB_ENV"; echo "SELECTED_SHA256=$SUM" >> "$GITHUB_ENV"
          echo "selected=$SEL sha256=$SUM $GATE"
          [ "$GATE" = "gate=PASS" ] || { echo "::error::capacity / integrity gate FAILED — the rehearsal is NOT started ($GATE)"; exit 1; }
          [[ "$SEL" =~ ^leadcapture-[0-9]{8}-[0-9]{6}\.sql\.gz$ ]] && [[ "$SUM" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no complete, gzip-valid backup selected"; exit 1; }

      - name: Phase 2 — g6-restore (ONE disposable network-less postgres container; the selected backup read-only; ON_ERROR_STOP; cleanup by trap)
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='g6-restore' ARG1='$SELECTED_BACKUP' ARG2='$SELECTED_SHA256' ARG3='$TAG' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/g6-restore.log"
          grep -q '^RESTORE_REHEARSAL=PASS' "$RUNNER_TEMP/g6-restore.log" || { echo "::error::the restore rehearsal did not report PASS"; exit 1; }

      - name: g6-verify AFTER (ALWAYS, read-only — no g6 resource remains; backup files, containers, volumes, images and env unchanged)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='g6-verify' ARG1='' ARG2='' ARG3='$TAG' bash \"\$HOME/b20-act.sh\"" < /dev/null | tee "$RUNNER_TEMP/g6-after.log"
          [ -f "$RUNNER_TEMP/backups-before.txt" ] || { echo "no inventory recorded (Phase 1 did not run); nothing to compare"; exit 0; }
          grep -E '^backup leadcapture-' "$RUNNER_TEMP/g6-after.log" | sed -E 's/ age_h=[0-9]+//' | sort > "$RUNNER_TEMP/backups-after.txt"
          grep -E '^(all containers|all volumes|images|postgres mounts|env):' "$RUNNER_TEMP/g6-after.log" | sort > "$RUNNER_TEMP/stack-after.txt"
          if diff -q "$RUNNER_TEMP/backups-before.txt" "$RUNNER_TEMP/backups-after.txt" >/dev/null; then echo "backup files unchanged (same set, sizes, mtimes, sha256)"; else echo "::error::backup files CHANGED during the rehearsal"; diff "$RUNNER_TEMP/backups-before.txt" "$RUNNER_TEMP/backups-after.txt" || true; exit 1; fi
          if diff -q "$RUNNER_TEMP/stack-before.txt" "$RUNNER_TEMP/stack-after.txt" >/dev/null; then echo "containers / volumes / images / postgres mounts / env unchanged"; else echo "::error::stack inventory CHANGED"; diff "$RUNNER_TEMP/stack-before.txt" "$RUNNER_TEMP/stack-after.txt" || true; exit 1; fi

      - name: c4-verify AFTER (ALWAYS, read-only — baseline equality, deploy/schema/env unchanged, queue and worker health)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='c4-verify' ARG1='$EXPECTED_SHA' ARG2='$EXPECTED_PREV_SHA' ARG3='$TAG|${BASELINE_MD5:-none}|${SMOKE_START_MS:-0}' bash \"\$HOME/b20-act.sh\"" < /dev/null

      - name: Remove the script from the VPS (always)
        if: always()
        run: |
          ssh vps 'rm -f "$HOME/b20-act.sh"' < /dev/null || true
          rm -f "$RUNNER_TEMP"/g6-*.log "$RUNNER_TEMP"/backups-*.txt "$RUNNER_TEMP"/stack-*.txt
