          ssh vps "DEPLOY_PATH='$VPS_DEPLOY_PATH' PHASE='b22-cleanup' ARG1='$SMOKE_START_MS' ARG2='$TAG' ARG3='$EXPECTED' bash \"\$HOME/b20-act.sh\"" < /dev/null

      - name: cleanup (ALWAYS — exactly the recorded disposable rows)
        if: always()
        env:
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          STATE="$RUNNER_TEMP/b22/state.json"
