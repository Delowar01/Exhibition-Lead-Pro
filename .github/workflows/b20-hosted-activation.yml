          START="$(grep -oE '^now_epoch_ms=[0-9]+' "$RUNNER_TEMP/b22-infra.log" | head -1 | cut -d= -f2)"
          [ -n "$START" ] || { echo "b22-infra did not report the clock"; exit 1; }
          echo "SMOKE_START_MS=$START" >> "$GITHUB_ENV"

