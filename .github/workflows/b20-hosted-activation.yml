          n_pair="$(grep -cE '^AI_INTEGRATIONS_GEMINI_API_KEY: unset$' "$L" || true)"
          bad="$(grep -cE '^(GEMINI_API_KEY|AI_INTEGRATIONS_GEMINI_API_KEY): set$' "$L" || true)"
          echo "GEMINI_API_KEY absent/empty lines: $n_key (env file + container = 2 expected); proxy key unset lines: $n_pair; credential-present lines: $bad"
          [ "$n_key" = "2" ] && [ "$n_pair" = "2" ] && [ "$bad" = "0" ] || { echo "a Gemini credential appears to be present — the probe must not be sent"; exit 1; }

