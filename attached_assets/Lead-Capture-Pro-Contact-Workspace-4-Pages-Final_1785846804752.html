function documentRows(){const arr=filteredDocs();if(!arr.length)return `<tr><td colspan="7" style="text-align:center;padding:38px;color:var(--muted)">No documents match your filters.</td></tr>`;return arr.slice(0,state.rows).map(d=>`<tr><td><div class="doc-name"><div class="file-badge ${d.type.toLowerCase()}">${d.type}</div><div><strong>${d.name}</strong><span>${d.desc}</span></div></div></td><td><span class="pill ${d.category==='Proposals'?'purple':d.category==='Brochures'?'blue':d.category==='Contracts'?'orange':'green'}">${d.category}</span></td><td><span class="pill ${d.type==='PDF'?'red':d.type==='XLSX'?'green':d.type==='DOCX'?'blue':'orange'}">${d.type}</span></td><td>${d.size}</td><td>${d.updated}<br><span class="muted">${d.time}</span></td><td><div class="owner-cell"><img src="${avatar}" alt=""><span>${d.owner}</span></div></td><td><div class="doc-actions"><button class="table-action" onclick="docAction('preview',${d.id})" aria-label="Preview">${svg('eye','sm')}</button><button class="table-action" onclick="docAction('download',${d.id})" aria-label="Download">${svg('download','sm')}</button><div class="dropdown"><button class="table-action" onclick="toggleDropdown(this)" aria-label="More">${svg('more','sm')}</button><div class="dropdown-menu"><button onclick="docAction('share',${d.id})">Share</button><button onclick="docAction('rename',${d.id})">Rename</button><button onclick="docAction('move',${d.id})">Move</button><button onclick="docAction('versions',${d.id})">Version history</button><button onclick="docAction('summary',${d.id})">AI summary</button><button onclick="docAction('delete',${d.id})">Delete</button></div></div></div></td></tr>`).join('')}
function resultCountText(){const n=filteredDocs().length;return n?`Showing 1 to ${Math.min(state.rows,n)} of ${n} documents`:'Showing 0 documents'}
function rightDocuments(){return `${card('Document Summary',`<div class="doc-stat-grid"><div class="doc-stat"><strong style="color:var(--green)">24</strong><span>Total Documents</span></div><div class="doc-stat"><strong style="color:var(--green)">8</strong><span>Shared</span></div><div class="doc-stat"><strong style="color:var(--red)">4</strong><span>Pending Review</span></div><div class="doc-stat"><strong>5</strong><span>Updated This Month</span></div></div>`,'right-card')}${card('Recent Activity',`<div class="doc-activity"><div class="doc-activity-row"><div class="file-badge">PDF</div><div><strong>Proposal - ABC Company</strong><span>Viewed by John Smith</span></div><time>May 25</time></div><div class="doc-activity-row"><div class="file-badge xlsx">XLSX</div><div><strong>Pricing Details</strong><span>Downloaded by Sara Khan</span></div><time>May 18</time></div><div class="doc-activity-row"><div class="file-badge docx">DOCX</div><div><strong>Implementation Guide</strong><span>Viewed by Ahmed Hassan</span></div><time>May 15</time></div><div class="doc-activity-row"><div class="file-badge pptx">PPTX</div><div><strong>Company Profile</strong><span>Downloaded by John Smith</span></div><time>May 05</time></div></div><div style="text-align:center;margin-top:12px"><button class="link-btn">View All Activity</button></div>`,'right-card')}${card('Document Insights',`<div class="insight-list"><div class="insight"><i></i><span><b>Most viewed:</b> Proposal - ABC Company (12 views)</span></div><div class="insight"><i></i><span><b>Most downloaded:</b> Pricing Details (8 times)</span></div><div class="insight"><i></i><span><b>Pending review:</b> 4 documents</span></div><div class="insight"><i></i><span><b>Expiring soon:</b> 2 documents</span></div></div><div style="text-align:center;margin-top:12px"><button class="link-btn">View All Insights</button></div>`,'right-card')}`}
const aiTools=[['chat','Chat','message','Ask anything about this contact'],['summary','Summary','file','Get AI summary of contact & company'],['research','Research','research','Research company, industry & news'],['email','Email Writer','mail','Generate professional emails'],['whatsapp','WhatsApp Writer','whatsapp','Create WhatsApp messages'],['followup','Follow-up Ideas','sparkles','Get smart follow-up suggestions'],['objection','Objection Handler','shield','Handle objections with confidence'],['meeting','Meeting Prep','calendar','Prepare for upcoming meetings'],['proposal','Proposal Summary','file','Summarize proposal and risks'],['executive','Executive Summary','report','Create management summary']];
function copilotPage(){return `<section class="card copilot-card"><header class="copilot-head"><div class="ai-orb">${svg('sparkles')}</div><div><h2>AI Copilot</h2><p>Your intelligent assistant to help you engage, analyze and win more deals.</p></div></header><nav class="tool-tabs">${aiTools.map(t=>`<button class="tool-tab ${state.aiTool===t[0]?'active':''}" onclick="selectAITool('${t[0]}')">${svg(t[2],'sm')} ${t[1]}</button>`).join('')}</nav><div id="toolContent">${renderAITool()}</div></section>`}
function renderAITool(){if(state.aiTool==='chat')return chatUI();const config={summary:['Contact Summary','Generate a concise relationship and buying-intent summary.'],research:['Company Research','Research ABC Company, its industry, needs, opportunities and risks.'],meeting:['Meeting Preparation','Prepare objectives, talking points, questions, objections and materials.'],email:['Email Writer','Generate a professional follow-up email.'],whatsapp:['WhatsApp Writer','Create a concise WhatsApp message.'],followup:['Follow-up Suggestions','Generate practical next-step recommendations.'],objection:['Objection Handler','Enter the objection and receive a recommended response.'],proposal:['Proposal Summary','Summarize scope, value, pricing, deliverables, timeline and risks.'],executive:['Executive Summary','Create a management-level contact and opportunity summary.']}[state.aiTool];let fields='';if(state.aiTool==='email')fields=`<div class="field"><label>Email Objective</label><select><option>Follow up after proposal</option><option>Schedule meeting</option><option>Share pricing</option></select></div><div class="field"><label>Tone</label><select><option>Professional</option><option>Friendly</option><option>Direct</option></select></div><div class="field full"><label>Key Message</label><textarea>Follow up on proposal and confirm next steps.</textarea></div>`;else if(state.aiTool==='whatsapp')fields=`<div class="field"><label>Message Objective</label><select><option>Follow-up</option><option>Meeting reminder</option><option>Share document</option></select></div><div class="field"><label>Tone</label><select><option>Friendly</option><option>Professional</option></select></div><div class="field"><label>Length</label><select><option>Short</option><option>Medium</option></select></div>`;else if(state.aiTool==='objection')fields=`<div class="field full"><label>Customer Objection</label><textarea placeholder="Example: Your price is higher than competitors."></textarea></div><div class="field"><label>Risk Level</label><select><option>Medium</option><option>High</option><option>Low</option></select></div>`;else fields=`<div class="field full"><label>Focus or Instructions</label><textarea placeholder="Add optional instructions...">Use the latest contact, interaction and document data.</textarea></div>`;return `<div class="tool-panel"><h3>${config[0]}</h3><p>${config[1]}</p><div class="tool-form">${fields}</div><button class="btn btn-purple" style="margin-top:12px" onclick="generateAI('${state.aiTool}')">${svg('sparkles','sm')} Generate</button><div id="generatedOutput"></div></div>`}
function chatUI(){return `<div class="chat-window"><div class="messages" id="messages"><div class="message"><div class="msg-avatar">${svg('sparkles')}</div><div><div class="bubble">Hello! I'm your AI Copilot for John Smith.<br>How can I help you today?<time>10:32 AM</time></div></div></div><div class="message user"><div class="bubble">Summarize the latest interactions with John Smith.<time>10:33 AM</time></div></div><div class="message"><div class="msg-avatar">${svg('sparkles')}</div><div><div class="bubble">Here's a summary of the latest interactions with John Smith:<ul><li>Met at LEAP 2026 and discussed the lead capture solution.</li><li>Requested pricing and feature details by email.</li><li>Shared product brochure and technical specifications via WhatsApp.</li><li>Scheduled proposal review for Jun 8, 2026.</li><li>High buying intent detected from multiple engagement signals.</li></ul><time>10:33 AM</time></div><div class="message-actions"><button class="mini-action" onclick="copyText('AI response copied.')">${svg('copy','sm')} Copy</button><button class="mini-action" onclick="regenerateChat()">${svg('refresh','sm')} Regenerate</button><button class="mini-action" onclick="toast('Response added to note.')">${svg('check','sm')} Use Response</button></div></div></div></div><div class="suggested">${['Summarize latest interactions','Prepare for meeting','Suggest follow-up','Write follow-up email','Create WhatsApp message','What objections should I expect?','Summarize latest proposal','Create executive summary'].map(q=>`<button onclick="usePrompt('${q.replaceAll("'","\\'")}')">${svg('sparkles','sm')} ${q}</button>`).join('')}</div><div class="composer"><div class="composer-box"><textarea id="aiInput" placeholder="Ask anything about John Smith..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAIMessage()}"></textarea><div class="composer-tools"><button class="icon-btn" onclick="toast('Attachment picker opened.')">${svg('paperclip','sm')}</button><button class="icon-btn" onclick="toast('Voice input is ready.')">${svg('mic','sm')}</button><button class="icon-btn" onclick="toast('AI tools opened.')">${svg('sparkles','sm')}</button><button class="send" onclick="sendAIMessage()">${svg('send')}</button></div></div><div class="ai-disclaimer">AI responses may be inaccurate. Please verify important information.</div></div></div>`}
function rightCopilot(){return `${card('AI Tools',`<div class="ai-tools-grid">${aiTools.filter(t=>t[0]!=='chat'&&t[0]!=='executive').map(t=>`<div class="ai-tool-card" onclick="selectAITool('${t[0]}')"><div class="tool-icon">${svg(t[2])}</div><strong>${t[1]}</strong><span>${t[3]}</span></div>`).join('')}</div>`,'right-card')}${card(`AI Confidence ${svg('info','sm')}`,`<div class="confidence-card"><div class="confidence-line"><div><strong>92%</strong><div style="font-size:9px;color:var(--green);margin-top:6px">High Confidence</div></div><svg class="spark" viewBox="0 0 120 40"><path d="M3 31 L17 20 L29 25 L43 14 L55 20 L69 10 L82 14 L98 5 L116 1" fill="none" stroke="#16a34a" stroke-width="2"/><path d="M3 31 L17 20 L29 25 L43 14 L55 20 L69 10 L82 14 L98 5 L116 1 L116 40 L3 40Z" fill="rgba(22,163,74,.08)"/></svg></div><p style="font-size:8.8px;color:var(--muted)">Based on 42 interactions and 18 signals</p></div>`,'right-card')}${card('Recommended Next Action',`<div class="next-mini"><div class="row-icon orange">${svg('phone')}</div><div><strong>Call John Smith</strong><span>High Priority · Due within 24 hours</span></div><span class="arrow">${svg('chevron','sm')}</span></div>`,'right-card')}`}
function render(){document.querySelectorAll('.page-tab').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.getElementById('profileCard').innerHTML=profile(state.page==='overview');const content=document.getElementById('content'),right=document.getElementById('rightRail');if(state.page==='overview'){content.innerHTML=overview();right.innerHTML=rightOverview()}if(state.page==='timeline'){content.innerHTML=timelinePage();right.innerHTML=rightTimeline()}if(state.page==='documents'){content.innerHTML=documentsPage();right.innerHTML=rightDocuments()}if(state.page==='copilot'){content.innerHTML=copilotPage();right.innerHTML=rightCopilot()}hydrate(document)}
function switchPage(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'});if(innerWidth<760)document.querySelector(`[data-page="${page}"]`)?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}
function filterTimeline(type){state.timelineType=type;render()}
function toggleAdvancedFilters(){document.getElementById('advancedFilters')?.classList.toggle('open')}
function loadMoreEvents(){data.timeline.push({id:99,date:'Apr 18',time:'09:30 AM',type:'documents',marker:'blue',icon:'file',title:'Product Brochure Viewed',meta:'Document View · by John Smith',desc:'John viewed the product brochure for 4 minutes.',status:'Document',statusClass:'blue',owner:'John Smith',role:'Contact'});render();toast('More events loaded.')}
function selectCategory(cat){state.docCategory=cat;state.docPage=1;render()}
function cycleDocFilter(btn,kind){if(kind==='type'){const opts=['All Types','PDF','DOCX','XLSX','PPTX'];state.docType=opts[(opts.indexOf(state.docType)+1)%opts.length]}if(kind==='date'){const opts=['All Time','This Month','Last 30 Days'];state.docDate=opts[(opts.indexOf(state.docDate)+1)%opts.length]}if(kind==='category'){state.docCategory='All Documents'}render()}
function searchDocs(q){state.docQuery=q;document.getElementById('docRows').innerHTML=documentRows();document.getElementById('resultCount').textContent=resultCountText();hydrate(document.getElementById('docRows'))}
function changeRows(v){state.rows=Number(v);render()}
function changeDocPage(delta){state.docPage=Math.max(1,state.docPage+delta);toast(`Page ${state.docPage} selected.`)}
function selectAITool(tool){state.aiTool=tool;if(state.page!=='copilot')state.page='copilot';render()}
function generateAI(tool){const out=document.getElementById('generatedOutput');if(!out)return;out.innerHTML=`<div class="skeleton" style="margin-top:12px"><div class="sk"></div></div>`;setTimeout(()=>{const outputs={summary:'John Smith is a senior decision maker with high engagement, active vendor evaluation and a Q3 2026 implementation target. Priorities are integration, implementation speed and ROI. Recommended approach: a direct value-based follow-up with clear next steps.',research:'ABC Company is a mid-market technology services business with 201–500 employees. Likely needs include faster field lead capture, CRM integration and sales visibility. Opportunity: enterprise rollout. Risks: competitive evaluation and budget timing.',meeting:'Meeting objective: confirm decision criteria and agree on next step. Discuss integration, implementation timeline, ROI and procurement. Ask who approves budget, what systems must integrate and what success metric matters most. Bring proposal, pricing, ROI model and technical integration guide.',email:'Subject: Next steps for ABC Company\n\nHi John,\n\nThank you for reviewing our proposal. I would like to schedule a short call to confirm your integration priorities, implementation timeline and the best next step for your team. Are you available tomorrow at 10:00 AM?\n\nBest regards,\nAhmed',whatsapp:'Hi John, hope you are doing well. I wanted to follow up on the proposal and confirm the next steps. Would tomorrow at 10:00 AM work for a short call?',followup:'1. Call within 24 hours. 2. Confirm integration scope. 3. Share ROI calculator. 4. Schedule product demo with decision stakeholders. 5. Set a proposal review date.',objection:'Recommended response: acknowledge the price concern, connect the investment to measurable lead-capture efficiency and sales visibility, then compare total value rather than license price. Follow-up question: Which business outcome would make the investment justifiable?',proposal:'Scope: enterprise lead capture and contact intelligence. Value: faster capture, better follow-up and sales visibility. Pricing: latest commercial proposal shared May 25. Timeline: Q3 2026. Open questions: integration scope and final user count. Risk: budget approval and competitor comparison.',executive:'John Smith is a high-value decision maker at ABC Company. Engagement is strong and commercial potential is high. The opportunity is in active evaluation with a Q3 2026 target. Main risks are competitor comparison and pending budget approval. Management attention: support a value-led call within 24 hours and prepare ROI evidence.'};out.innerHTML=`<div class="generated-output"><h4>${toolLabel(tool)}</h4><div style="white-space:pre-line">${outputs[tool]}</div><div class="actions"><button class="mini-action" onclick="copyText('Generated content copied.')">${svg('copy','sm')} Copy</button><button class="mini-action" onclick="generateAI('${tool}')">${svg('refresh','sm')} Regenerate</button><button class="mini-action" onclick="toast('Generated content saved as draft.')">${svg('check','sm')} Save</button></div></div>`;hydrate(out)},650)}
function toolLabel(tool){return (aiTools.find(t=>t[0]===tool)||['','AI Result'])[1]}
function usePrompt(q){document.getElementById('aiInput').value=q;sendAIMessage()}
function sendAIMessage(){const input=document.getElementById('aiInput'),messages=document.getElementById('messages');if(!input||!messages)return;const q=input.value.trim();if(!q)return toast('Type a question for AI Copilot.','error');messages.insertAdjacentHTML('beforeend',`<div class="message user"><div class="bubble">${escapeHtml(q)}<time>Now</time></div></div><div class="message" id="thinking"><div class="msg-avatar">${svg('sparkles')}</div><div class="bubble">Thinking…</div></div>`);input.value='';hydrate(messages);setTimeout(()=>{document.getElementById('thinking')?.remove();messages.insertAdjacentHTML('beforeend',`<div class="message"><div class="msg-avatar">${svg('sparkles')}</div><div><div class="bubble">${answerAI(q)}<time>Now</time></div><div class="message-actions"><button class="mini-action" onclick="copyText('AI response copied.')">${svg('copy','sm')} Copy</button><button class="mini-action" onclick="regenerateChat()">${svg('refresh','sm')} Regenerate</button><button class="mini-action" onclick="toast('Response added to note.')">${svg('check','sm')} Use Response</button></div></div></div>`);hydrate(messages);messages.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'})},750)}
function answerAI(q){q=q.toLowerCase();if(q.includes('proposal'))return 'The latest proposal covers enterprise lead capture, contact intelligence, CRM integration and implementation support. Key open items are final user count, integration scope and budget approval.';if(q.includes('meeting'))return 'For the next meeting, focus on integration requirements, implementation timing, decision stakeholders and ROI. Bring the proposal, ROI calculator and technical guide.';if(q.includes('objection'))return 'Expect price comparison and implementation-risk objections. Respond with total business value, rollout support and measurable efficiency gains.';if(q.includes('whatsapp'))return 'Suggested message: Hi John, I wanted to follow up on the proposal and confirm the next steps. Would tomorrow at 10:00 AM work for a short call?';if(q.includes('email'))return 'I prepared a professional follow-up email focused on confirming integration priorities and scheduling the next call.';return 'John is highly engaged, has clear buying intent and is evaluating vendors for a Q3 2026 implementation. The best next action is a call within 24 hours focused on integration, ROI and decision timing.'}
function regenerateChat(){toast('AI response regenerated.');}
function copyText(msg){navigator.clipboard?.writeText(msg).catch(()=>{});toast(msg)}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function docAction(action,id){const d=data.documents.find(x=>x.id===id);if(!d)return;if(action==='preview')return openPreview(d);if(action==='versions')return openVersions(d);if(action==='summary')return openDocSummary(d);if(action==='delete')return confirmDeleteDoc(d);if(action==='rename'||action==='move'||action==='share')return toast(`${d.name}: ${action} action opened.`);toast(`${d.name} downloaded.`)}
function openPreview(d){openCustomModal(d.name,`<div class="preview-area">${svg('file','lg')}<div><strong>Document Preview</strong><p>${d.type} preview for ${d.name}</p></div></div><div class="preview-meta"><div class="meta-card"><small>Owner</small><strong>${d.owner}</strong></div><div class="meta-card"><small>Updated</small><strong>${d.updated}</strong></div><div class="meta-card"><small>File Size</small><strong>${d.size}</strong></div></div>`,`<button class="btn" onclick="openVersions(data.documents.find(x=>x.id===${d.id}))">${svg('history','sm')} Version History</button><button class="btn btn-purple" onclick="openDocSummary(data.documents.find(x=>x.id===${d.id}))">${svg('sparkles','sm')} AI Summary</button><button class="btn btn-orange" onclick="toast('${d.name} downloaded.')">${svg('download','sm')} Download</button>`,true)}
function openVersions(d){openCustomModal(`Version History — ${d.name}`,`<div class="version-list"><div class="version-row"><strong>v3.0</strong><div>May 25, 2026<br><span>Ahmed Hassan · Final commercial revision</span></div><div>${d.size}</div><span class="pill green">Current</span></div><div class="version-row"><strong>v2.0</strong><div>May 22, 2026<br><span>Sara Khan · Updated pricing</span></div><div>2.3 MB</div><button class="mini-action" onclick="toast('Version 2.0 restored.')">Restore</button></div><div class="version-row"><strong>v1.0</strong><div>May 18, 2026<br><span>Ahmed Hassan · Initial upload</span></div><div>2.1 MB</div><button class="mini-action" onclick="toast('Version 1.0 downloaded.')">Download</button></div></div>`,`<button class="btn" onclick="closeModal()">Close</button>`) }
function openDocSummary(d){openCustomModal(`AI Summary — ${d.name}`,`<div class="generated-output" style="margin-top:0"><h4>Main Purpose</h4><p>Present the proposed enterprise lead-capture solution and commercial approach for ABC Company.</p><h4>Key Points</h4><ul><li>Enterprise lead capture and contact intelligence</li><li>CRM and ERP integration requirements</li><li>Target implementation in Q3 2026</li></ul><h4>Commercial Information</h4><p>Pricing and final user count require confirmation.</p><h4>Actions & Risks</h4><p>Confirm integration scope, budget approval date and competitive decision criteria.</p></div>`,`<button class="btn" onclick="closeModal()">Close</button><button class="btn btn-purple" onclick="toast('AI summary copied.')">${svg('copy','sm')} Copy Summary</button>`) }
function confirmDeleteDoc(d){openCustomModal('Delete Document',`<p>Delete <strong>${d.name}</strong>? This action will move the document to trash.</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-orange" onclick="closeModal();toast('Document moved to trash.','error')">Delete</button>`) }
function toggleDropdown(btn){const dd=btn.closest('.dropdown');document.querySelectorAll('.dropdown.open').forEach(x=>{if(x!==dd)x.classList.remove('open')});dd.classList.toggle('open')}
document.addEventListener('click',e=>{if(!e.target.closest('.dropdown'))document.querySelectorAll('.dropdown.open').forEach(x=>x.classList.remove('open'))})
function openModal(type){const forms={edit:['Edit Contact',`<div class="form-grid"><div class="field"><label>First Name</label><input value="John"></div><div class="field"><label>Last Name</label><input value="Smith"></div><div class="field"><label>Job Title</label><input value="Director of Sales"></div><div class="field"><label>Company</label><input value="ABC Company"></div><div class="field"><label>Email</label><input value="john.smith@abc.com"></div><div class="field"><label>Phone</label><input value="+971 50 123 4567"></div></div>`,'Save Changes'],meeting:['Schedule Meeting',`<div class="form-grid"><div class="field"><label>Date</label><input type="date" value="2026-06-12"></div><div class="field"><label>Time</label><input type="time" value="14:00"></div><div class="field full"><label>Purpose</label><textarea>Product demonstration and proposal review.</textarea></div></div>`,'Schedule'],call:['Schedule Call',`<div class="form-grid"><div class="field"><label>Date</label><input type="date" value="2026-06-05"></div><div class="field"><label>Time</label><input type="time" value="10:00"></div><div class="field full"><label>Notes</label><textarea>Discuss proposal, integration and next steps.</textarea></div></div>`,'Schedule Call'],note:['Add Note',`<div class="field"><label>Note</label><textarea placeholder="Add a note about John Smith..."></textarea></div>`,'Add Note'],task:['Create Task',`<div class="form-grid"><div class="field full"><label>Task</label><input placeholder="Task title"></div><div class="field"><label>Due Date</label><input type="date"></div><div class="field"><label>Priority</label><select><option>High</option><option>Medium</option><option>Low</option></select></div></div>`,'Create Task'],email:['Generate Email',`<div class="form-grid"><div class="field"><label>Objective</label><select><option>Follow up after proposal</option><option>Schedule meeting</option></select></div><div class="field"><label>Tone</label><select><option>Professional</option><option>Friendly</option></select></div><div class="field full"><label>Generated Email</label><textarea>Hi John,\n\nThank you for reviewing our proposal. I would like to schedule a short call to confirm your integration priorities and the next steps. Are you available tomorrow at 10:00 AM?\n\nBest regards,\nAhmed</textarea></div></div>`,'Save as Draft'],summary:['Full AI Contact Summary',`<div class="generated-output" style="margin-top:0"><p>John Smith is the Director of Sales at ABC Company and a confirmed decision maker. He has high buying intent, strong engagement and a Q3 2026 implementation target. Current priorities are integration, implementation speed and ROI. He is evaluating multiple vendors, with budget approval still pending. The recommended approach is a direct follow-up call within 24 hours supported by proposal and ROI evidence.</p></div>`,'Close'],tags:['Manage Tags',`<div class="tags"><span class="tag purple">Decision Maker ×</span><span class="tag blue">LEAP 2026 ×</span><span class="tag green">VIP ×</span><span class="tag green">High Value ×</span></div><div class="field" style="margin-top:12px"><label>Add Tag</label><input placeholder="Type tag name"></div>`,'Save Tags'],delete:['Delete Contact',`<p>Are you sure you want to delete John Smith? This action cannot be undone.</p>`,'Delete'],quick:['Quick Add',`<div class="quick-list"><button class="btn" onclick="closeModal();openModal('task')">${svg('task')} Create Task</button><button class="btn" onclick="closeModal();openModal('meeting')">${svg('calendar')} Schedule Meeting</button><button class="btn" onclick="closeModal();openModal('upload')">${svg('upload')} Upload Document</button><button class="btn" onclick="closeModal();openModal('note')">${svg('note')} Add Note</button></div>`,'Close']};if(type==='upload')return openUpload();const f=forms[type];if(!f)return;openCustomModal(f[0],f[1],`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-orange" onclick="closeModal();toast('${f[2]} completed.')">${f[2]}</button>`)}
function openUpload(){openCustomModal('Upload Document',`<div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()"><input id="fileInput" type="file" hidden onchange="fileSelected(this)">${svg('upload','lg')}<strong>Drop a file here or click to browse</strong><span>PDF, DOCX, XLSX, PPTX or images</span></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Document Name</label><input id="uploadName" placeholder="Document name"></div><div class="field"><label>Category</label><select><option>Proposals</option><option>Contracts</option><option>Presentations</option><option>Brochures</option><option>Technical</option></select></div><div class="field full"><label>Tags</label><input placeholder="proposal, enterprise"></div><div class="field full"><label>Description</label><textarea placeholder="Document description"></textarea></div></div><div class="upload-progress" id="uploadProgress"><div class="progress-track"><i id="uploadBar"></i></div><div class="progress-label"><span>Uploading…</span><b id="uploadPercent">0%</b></div></div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-orange" onclick="simulateUpload()">${svg('upload','sm')} Upload</button>`,true);const dz=document.getElementById('dropzone');['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>{if(e.dataTransfer.files[0]){document.getElementById('uploadName').value=e.dataTransfer.files[0].name}})}
function fileSelected(input){if(input.files[0])document.getElementById('uploadName').value=input.files[0].name}
function simulateUpload(){const box=document.getElementById('uploadProgress'),bar=document.getElementById('uploadBar'),pct=document.getElementById('uploadPercent');box.classList.add('open');let n=0;const timer=setInterval(()=>{n+=10;bar.style.width=n+'%';pct.textContent=n+'%';if(n>=100){clearInterval(timer);setTimeout(()=>{closeModal();toast('Document uploaded successfully.')},300)}},100)}
function openCustomModal(title,body,foot,large=false){const modal=document.getElementById('modal');modal.classList.toggle('large',large);document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFoot').innerHTML=foot;document.getElementById('modalBackdrop').classList.add('open');document.getElementById('modalBackdrop').setAttribute('aria-hidden','false');hydrate(document.getElementById('modalBackdrop'))}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('modalBackdrop').setAttribute('aria-hidden','true')}
function toast(msg,type='success'){const t=document.createElement('div');t.className=`toast ${type}`;t.innerHTML=`${svg(type==='error'?'shield':'check-circle')}<span>${msg}</span>`;document.getElementById('toastWrap').appendChild(t);setTimeout(()=>t.remove(),3300)}
function toggleTheme(){const next=document.body.dataset.theme==='dark'?'light':'dark';document.body.dataset.theme=next;try{localStorage.setItem('lcp-theme',next)}catch(e){}toast(next==='dark'?'Dark theme enabled.':'Light theme enabled.')}
function toggleSidebar(){if(innerWidth<=760)return closeMobileNav();document.body.classList.toggle('sidebar-collapsed')}
function toggleMobileNav(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}
function closeMobileNav(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('open')}
function globalSearch(e){if(e.key==='Enter')toast(e.target.value.trim()?`Searching for “${e.target.value.trim()}”…`:'Enter a search term.','success')}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMobileNav()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('.global-search input')?.focus()}});window.addEventListener('resize',()=>{if(innerWidth>760)closeMobileNav()});
try{document.body.dataset.theme=localStorage.getItem('lcp-theme')||'light'}catch(e){}
hydrate();render();
</script>
</body>
</html>
