# Hostinger VPS override — dev.kaptnow.com development deployment.
#
# Layered on top of the existing self-hosting stack; it changes ONLY how ports
# are published on the shared VPS (which also hosts an unrelated CloudPanel
# website on 80/443/8443):
#
#   - web  → published on loopback only (127.0.0.1:18080). CloudPanel's nginx
#            reverse-proxies https://dev.kaptnow.com → http://127.0.0.1:18080.
#   - api  → NOT published on the host at all; it stays internal to the compose
#            network and is reached exclusively through the web container's
#            /api proxy (API_UPSTREAM=http://api:8080).
#
#   - postgres → the repo's bundled postgres:16-alpine IS the development
#            database (COMPOSE_PROFILES=local-db in the VPS env file), but its
#            host port publication is removed: it is reachable ONLY on the
#            internal Docker network as postgres:5432. Data persists in the
#            existing named volume (pgdata) across restarts/rebuilds/deploys.
#
# Redis and every other optional service stay disabled (profiles).
#
# Usage (from /opt/lead-capture-pro/app/docker — see scripts/deploy-vps.sh):
#   docker compose -f docker-compose.yml -f compose.vps.yml up -d --build api web
#
# The `!override` tag (Compose >= 2.24) REPLACES the base list instead of
# merging, which is the only way an override file can remove a port binding.

services:
  api:
    ports: !override []
    # Google Cloud Storage (private card images / documents / export
    # artifacts): the development service-account key lives ONLY on the VPS,
    # outside Git, and is mounted read-only into the api container alone.
    # GOOGLE_APPLICATION_CREDENTIALS in the VPS env file points at the
    # container path; OBJECT_STORAGE_AUTH=google selects standard Google auth.
    #
    # The runtime container runs as the non-root `app` user, and the key on
    # the VPS is leadpro:leadpro mode 640 — the api process gains read access
    # solely through this supplemental numeric group (leadpro's primary gid,
    # supplied at runtime via the VPS env file, never hardcoded in Git).
    group_add:
      - "${GCS_CREDENTIAL_GID:?GCS_CREDENTIAL_GID is required}"
    volumes:
      - /opt/lead-capture-pro/env/gcs-service-account.json:/secrets/gcs-service-account.json:ro
      # Batch 25 — PREPARED, NOT ACTIVE. The hosted activation (a separate,
      # owner-approved task — docs/B25_OBJECT_STORAGE.md "Hosted activation")
      # replaces the base file's named `objectdata` volume with a private host
      # directory on this VPS, outside the web root and outside Git, owned by
      # the container's app uid/gid and mode 700, e.g.
      #   sudo install -d -m 700 -o <app-uid> -g <app-gid> /opt/lead-capture-pro/data/objects
      # and sets OBJECT_STORAGE_DRIVER=fs, OBJECT_STORAGE_FS_ROOT=/data/objects
      # and OBJECT_STORAGE_ENCRYPTION_KEY in the VPS-only env file. Until then
      # every OBJECT_STORAGE_* variable stays unset and the api keeps the
      # pre-B25 Google Cloud driver unchanged. Uncomment ONLY at activation:
      # - /opt/lead-capture-pro/data/objects:/data/objects

  web:
    ports: !override
      - "127.0.0.1:18080:80"

  postgres:
    # Internal-only: no host binding at all (base file publishes 5432).
    ports: !override []
