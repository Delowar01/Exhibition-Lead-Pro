          type: ["string", "null"]
          description: "Provenance: the model that produced the extraction."
        promptVersion:
          type: ["integer", "null"]
          description: "Provenance: the extraction prompt version."
        processingTimeMs:
          type: ["integer", "null"]
          description: "OCR round-trip latency in milliseconds."
        validationStatus:
          type: ["object", "null"]
          description: "Deterministic validation + normalization summary computed at OCR time. Opaque JSON (see CaptureAnalysis.validation)."
        qualityScore:
          type: ["integer", "null"]
          description: "0-100 on-device capture-quality heuristic (mobile best-effort)."
        qualityMeta:
          type: ["object", "null"]
          description: "On-device quality signals (brightness/sharpness/coverage). Opaque JSON."
        createdAt:
          type: string
          format: date-time

