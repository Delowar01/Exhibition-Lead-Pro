    post:
      operationId: startCaptureBatch
      tags: [scans]
      summary: Analyze many captured cards at once (async batch)
      description: >-
        Enqueues one read-only analysis per submitted item and returns 202 immediately.
        Poll GET /scans/batch/{jobId} for progress and per-item results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureBatchInput"
      responses:
        "202":
          description: Accepted
          content:
