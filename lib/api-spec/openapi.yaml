          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerritoryUpdate"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Territory"
    delete:
      operationId: deleteTerritory
      tags: [territories]
      summary: Soft-delete a sales territory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /contacts/merge-history:
    get:
      operationId: listMergeHistory
      tags: [contacts]
      summary: List contact merge-history records
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeHistoryList"

  /contacts/merge-history/{id}/undo:
    post:
      operationId: undoContactMerge
      tags: [contacts]
      summary: Reverse a recorded contact merge (restores merged-away contacts and their child records)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoMergeResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ReadinessStatus:
      type: object
      properties:
        status:
          type: string
        checks:
          type: object
          properties:
            database:
              type: string
            storage:
              type: string
          required: [database, storage]
      required: [status, checks]

    MetricsSnapshot:
      type: object
      required: [uptimeSeconds, timestamp, requests, jobs]
      properties:
        uptimeSeconds:
          type: integer
        timestamp:
          type: string
          format: date-time
        requests:
          type: object
          required: [total, errors, errorRate, avgLatencyMs, maxLatencyMs, byStatusClass]
          properties:
            total:
              type: integer
            errors:
              type: integer
            errorRate:
              type: number
            avgLatencyMs:
              type: number
            maxLatencyMs:
              type: number
            byStatusClass:
              type: object
              required: ["2xx", "3xx", "4xx", "5xx"]
              properties:
                "2xx":
                  type: integer
                "3xx":
                  type: integer
                "4xx":
                  type: integer
                "5xx":
                  type: integer
        jobs:
          type: object
          required: [pending, active, enqueued, completed, failed, deadLettered]
          properties:
            pending:
              type: integer
            active:
              type: integer
            enqueued:
              type: integer
            completed:
              type: integer
            failed:
              type: integer
            deadLettered:
              type: integer

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        requestId:
          type: string
          description: Correlates this response with server logs (also returned as the X-Request-Id header).
        details:
          type: array
          description: Per-field validation issues (present on 400 validation failures).
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required: [field, message]
      required: [error]

    # PHASE 2.5 — AUTH EMAIL FLOWS
    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordInput:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string

    VerifyEmailInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ResendVerificationResult:
      type: object
      required: [success, alreadyVerified]
      properties:
        success:
          type: boolean
        alreadyVerified:
          type: boolean

    # PHASE 2.5 — INVITATIONS
    Invitation:
      type: object
      required: [id, companyId, email, role, status, expiresAt, createdAt]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        role:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected, cancelled, expired]
        invitedByUserId:
          type: integer
          nullable: true
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    InvitationResponse:
      type: object
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"

    InvitationListResponse:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"

    CreateInvitationInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, employee, primary_admin]
        roleIds:
          type: array
          items:
            type: integer
        companyId:
          type: integer
          nullable: true

    PublicInvitation:
      type: object
      required: [email, role, status]
      properties:
        email:
          type: string
        name:
          type: string
          nullable: true
        role:
          type: string
        status:
          type: string
        companyName:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time

    PublicInvitationResponse:
      type: object
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/PublicInvitation"

    AcceptInvitationInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        name:
          type: string
        password:
          type: string

    AcceptInvitationResult:
      type: object
      required: [success, user]
      properties:
        success:
          type: boolean
        user:
          type: object
          required: [id, email, name, role]
          properties:
            id:
              type: integer
            email:
              type: string
            name:
              type: string
            role:
              type: string

    RejectInvitationInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    # PHASE 2.5 — NOTIFICATIONS
    Notification:
      type: object
      required: [id, userId, category, title, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        companyId:
          type: integer
          nullable: true
        category:
          type: string
        title:
          type: string
        body:
          type: string
          nullable: true
        link:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"

    UnreadCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    MarkAllReadResponse:
      type: object
      required: [success, updated]
      properties:
        success:
          type: boolean
        updated:
          type: integer

    NotificationPreference:
      type: object
      required: [category, inApp, email]
      properties:
        category:
          type: string
        inApp:
          type: boolean
        email:
          type: boolean

    NotificationPreferencesResponse:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/NotificationPreference"

    UpdateNotificationPreferenceInput:
      type: object
      required: [category, inApp, email]
      properties:
        category:
          type: string
        inApp:
          type: boolean
        email:
          type: boolean

    # PUSH NOTIFICATIONS
    PushTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Expo push token (ExponentPushToken[...])
        platform:
          type: string
          enum: [ios, android]

    PushTokenUnregisterInput:
      type: object
      required: [token]
      properties:
        token:
          type: string

    # AUTH
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        rememberMe:
          type: boolean

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    RegisterInput:
      type: object
      required: [email, password, name, companyName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
        companyName:
          type: string
        industry:
          type: ["string", "null"]
        country:
          type: ["string", "null"]

    AuthResponse:
      type: object
      description: >-
        Successful login/register. On a password-only success, `token`, `refreshToken`,
        and `user` are present. When a second factor is required, only `mfaRequired`
        (true) and `mfaToken` are returned and the client must call /auth/mfa/verify-login.
        When the user's company mandates MFA but the user has not enrolled,
        `mfaEnrollmentRequired` (true) and `mfaToken` are returned with NO operational
        token; the client must complete MFA enrollment before access is granted.
      properties:
        token:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"
        mfaRequired:
          type: boolean
        mfaEnrollmentRequired:
          type: boolean
        mfaToken:
          type: string

    RefreshInput:
      type: object
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      required: [token, refreshToken]
      properties:
        token:
          type: string
        refreshToken:
          type: string

    MfaVerifyLoginInput:
      type: object
      required: [mfaToken, code]
      properties:
        mfaToken:
          type: string
        code:
          type: string
        rememberMe:
          type: boolean
        rememberDevice:
          type: boolean

    SessionInfo:
      type: object
      required: [id, current, createdAt]
      properties:
        id:
          type: integer
        current:
          type: boolean
        ipAddress:
          type: ["string", "null"]
        userAgent:
          type: ["string", "null"]
        browser:
          type: ["string", "null"]
        os:
          type: ["string", "null"]
        deviceType:
          type: ["string", "null"]
        lastUsedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionInfo"

    TerminateSessionsResponse:
      type: object
      required: [success, terminated]
      properties:
        success:
          type: boolean
        terminated:
          type: integer

    MfaStatus:
      type: object
      required: [enabled, companyRequired, backupCodesRemaining]
      properties:
        enabled:
          type: boolean
        enrolledAt:
          type: ["string", "null"]
          format: date-time
        companyRequired:
          type: boolean
        backupCodesRemaining:
          type: integer

    MfaSetupData:
      type: object
      required: [secret, otpauthUrl, qrDataUrl]
      properties:
        secret:
          type: string
        otpauthUrl:
          type: string
        qrDataUrl:
          type: string

    MfaEnableInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    MfaBackupCodesResponse:
      type: object
      required: [success, backupCodes]
      properties:
        success:
          type: boolean
        backupCodes:
          type: array
          items:
            type: string

    MfaPasswordInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    # USERS
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [platform_owner, primary_admin, admin, employee]
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        permissions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        contactVisibility:
          type: string
          enum: [own, selected, all]
        companyVisibility:
          type: string
          enum: [own, selected, all]
        accessibleCompanies:
          type: array
          items:
            type: integer
        mfaEnabled:
          type: boolean
        isActive:
          type: boolean
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        employeeId:
          type: ["string", "null"]
        jobTitle:
          type: ["string", "null"]
        employmentStatus:
          type: string
          enum: [active, probation, on_leave, suspended, offboarded]
        joiningDate:
          type: ["string", "null"]
          format: date
        managerId:
          type: ["integer", "null"]
        managerName:
          type: ["string", "null"]
        departmentId:
          type: ["integer", "null"]
        departmentName:
          type: ["string", "null"]
        teamId:
          type: ["integer", "null"]
        teamName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserList:
      type: object
      required: [users, total, page, limit]
      properties:
