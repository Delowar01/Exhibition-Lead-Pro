          type: ["string", "null"]
          description: "How the data was extracted: ai_vision | qr | vcard | nfc | manual."
        captureSource:
          type: ["string", "null"]
          description: "Where the card came from: camera | qr | vcard | digital_card | email_signature | nfc | manual."
