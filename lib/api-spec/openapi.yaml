  /scans/analyze:
    post:
      operationId: analyzeCapture
      tags: [scans]
      summary: Analyze captured (not-yet-saved) card fields — validation, recognition, and suggestions
      description: >-
        Read-only intelligent-capture analysis over the fields on a card being captured.
        Returns deterministic validation + normalization suggestions, recognition of
        existing contacts/organizations in the tenant, a duplicate warning, and smart
        gap-fill suggestions (best-effort AI industry soft-degrades). NEVER writes, links,
        merges, or auto-applies anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CaptureAnalyzeInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptureAnalysis"

